<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台語母音練習轉盤</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 載入芫荽 (Iansui) 字型 */
        @font-face {
            font-family: 'Iansui';
            src: url('https://cdn.jsdelivr.net/gh/ButKo/iansui@0.4/Iansui-Regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/ButKo/iansui@0.4/Iansui-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Iansui', 'BiauKai', 'DFKai-SB', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef3c7 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .font-iansui {
            font-family: 'Iansui', 'BiauKai', cursive, sans-serif;
        }

        /* 轉盤外框光暈效果 */
        .wheel-container {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 25px rgba(16, 185, 129, 0.25);
            border-radius: 50%;
        }

        /* 指針微動動畫 */
        @keyframes pointerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .pointer-pulse {
            animation: pointerPulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body id="appBody" class="flex flex-col items-center justify-between min-h-screen p-4 text-gray-800 cursor-pointer overflow-hidden">

    <!-- 頂部標題區 -->
    <header class="text-center mt-6 pointer-events-none">
        <h1 class="font-iansui text-5xl md:text-6xl font-bold text-emerald-900 tracking-wide drop-shadow-sm mb-3">
            台語母音練習
        </h1>
    </header>

    <!-- 主要轉盤區 -->
    <main class="w-full max-w-4xl flex flex-col items-center justify-center my-auto">
        <div class="relative flex flex-col items-center">
            
            <!-- 上方定位指針 -->
            <div class="absolute -top-6 z-20 pointer-pulse drop-shadow-md pointer-events-none">
                <svg width="52" height="60" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 56L4.51666 22.5C-1.89073 11.5 6.00288 0 18.6603 0H29.3397 C41.9971 0 49.8907 11.5 43.4833 22.5L24 56Z" fill="#EF4444"/>
                    <circle cx="24" cy="18" r="8" fill="#FFFFFF"/>
                </svg>
            </div>

            <!-- Canvas 轉盤 -->
            <div class="wheel-container relative p-3 bg-white border-4 border-amber-300">
                <canvas id="wheelCanvas" class="w-[330px] h-[330px] sm:w-[400px] sm:h-[400px] md:w-[450px] md:h-[450px] rounded-full"></canvas>
                
                <!-- 中心按鈕點綴 -->
                <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-20 h-20 md:w-24 md:h-24 rounded-full bg-amber-400 border-4 border-white text-amber-950 font-bold font-iansui text-2xl shadow-lg flex flex-col items-center justify-center pointer-events-none z-10">
                    <span>轉!</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 音效切換按鈕（右下角靜音控制） -->
    <div class="fixed bottom-4 right-4 z-30">
        <button id="soundToggleBtn" class="p-3 bg-white/90 backdrop-blur border border-emerald-200 rounded-full shadow-lg hover:bg-emerald-50 text-emerald-700 transition flex items-center justify-center w-12 h-12" title="切換音效">
            <i id="soundIcon" class="fa-solid fa-volume-high text-xl"></i>
        </button>
    </div>

    <!-- 純母音卡片彈窗 -->
    <div id="vowelModal" class="fixed inset-0 bg-black/45 backdrop-blur-md z-50 flex items-center justify-center hidden">
        <div class="bg-white/95 rounded-3xl p-12 sm:p-20 shadow-2xl flex items-center justify-center border-4 border-amber-300 min-w-[280px] min-h-[280px] sm:min-w-[360px] sm:min-h-[360px] relative transform transition-all duration-300 scale-100">
            <span id="modalVowelText" class="font-iansui text-9xl sm:text-[11rem] font-bold leading-none select-none">a</span>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="text-center text-xs text-gray-500 py-2 pointer-events-none">
        台語母音練習轉盤 ｜ 字型：芫荽 (Iansui)
    </footer>

    <!-- JavaScript 邏輯程式碼 -->
    <script>
        // 1. 母音資料設定
        const VOWELS = [
            { symbol: 'a', color: '#F87171', textColor: '#7F1D1D' },
            { symbol: 'i', color: '#FB923C', textColor: '#7C2D12' },
            { symbol: 'u', color: '#FACC15', textColor: '#713F12' },
            { symbol: 'o͘', color: '#4ADE80', textColor: '#14532D' },
            { symbol: 'e', color: '#38BDF8', textColor: '#0C4A6E' },
            { symbol: 'o', color: '#C084FC', textColor: '#581C87' }
        ];

        // 2. 轉盤狀態與 Canvas 變數
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = VOWELS.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        
        let currentAngle = 0;
        let isSpinning = false;
        let soundEnabled = true;
        let isModalOpen = false;

        // 設定高清畫質
        function setupCanvasResolution() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }

        // 繪製轉盤
        function drawWheel() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 8;

            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < numSlices; i++) {
                const angle = currentAngle + i * sliceAngle;
                const vowel = VOWELS[i];

                // 繪製扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                ctx.closePath();
                ctx.fillStyle = vowel.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();

                // 繪製母音文字
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                
                ctx.font = 'bold 46px "Iansui", "BiauKai", cursive, sans-serif';
                ctx.fillStyle = vowel.textColor;
                ctx.fillText(vowel.symbol, radius - 40, 0);
                ctx.restore();
            }

            // 外圓金邊
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#FCD34D';
            ctx.stroke();
        }

        // 3. Web Audio 音樂與聲音合成器
        let audioCtx = null;
        let bgMusicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 旋轉時背景音樂
        function startSpinMusic() {
            if (!soundEnabled) return;
            initAudio();

            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            let noteIdx = 0;

            bgMusicInterval = setInterval(() => {
                if (!isSpinning) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
                noteIdx++;
            }, 120);
        }

        function stopSpinMusic() {
            if (bgMusicInterval) {
                clearInterval(bgMusicInterval);
                bgMusicInterval = null;
            }
        }

        // 刻度音效
        function playTickSound() {
            if (!soundEnabled) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(750, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.03);

            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        // 停止時勝利音效
        function playWinSound() {
            if (!soundEnabled) return;
            initAudio();

            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];

            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0.18, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.3);
            });
        }

        // 4. 旋轉物理邏輯
        let lastSector = -1;

        function handleGlobalClick(e) {
            // 如果點擊的是聲音切換按鈕，不觸發轉盤
            if (e.target.closest('#soundToggleBtn')) return;

            // 如果彈窗開著，點擊關閉彈窗
            if (isModalOpen) {
                hideVowelModal();
                return;
            }

            // 觸發旋轉
            spin();
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;

            startSpinMusic();

            const extraRounds = 5 + Math.random() * 3;
            const totalRotation = extraRounds * 2 * Math.PI;
            
            const startAngle = currentAngle;
            const targetAngle = startAngle + totalRotation;
            const duration = 3800; // 3.8秒
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Ease Out 減速公式
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + (targetAngle - startAngle) * easeOut;

                // 檢查是否經過新扇形以播放音效
                const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
                const currentSector = Math.floor(normalizedAngle / sliceAngle);
                
                if (currentSector !== lastSector) {
                    playTickSound();
                    lastSector = currentSector;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    onSpinComplete();
                }
            }

            requestAnimationFrame(animate);
        }

        function onSpinComplete() {
            isSpinning = false;
            stopSpinMusic();
            playWinSound();

            // 計算中獎母音
            const pointerAngle = 1.5 * Math.PI;
            let normalizedAngle = (pointerAngle - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;
            const selectedIndex = Math.floor(normalizedAngle / sliceAngle) % numSlices;
            const selectedVowel = VOWELS[selectedIndex];

            showVowelModal(selectedVowel.symbol, selectedVowel.textColor);
        }

        // 彈窗顯示與隱藏
        function showVowelModal(symbol, textColor) {
            const modal = document.getElementById('vowelModal');
            const textEl = document.getElementById('modalVowelText');
            textEl.textContent = symbol;
            textEl.style.color = textColor || '#111827';
            modal.classList.remove('hidden');
            isModalOpen = true;
        }

        function hideVowelModal() {
            const modal = document.getElementById('vowelModal');
            modal.classList.add('hidden');
            isModalOpen = false;
        }

        // 5. 初始化與事件監聽
        window.addEventListener('load', () => {
            setupCanvasResolution();
            drawWheel();

            // 點擊全螢幕任意處皆可轉動 / 關閉彈窗
            document.getElementById('appBody').addEventListener('click', handleGlobalClick);

            // 音效切換
            document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                soundEnabled = !soundEnabled;
                const icon = document.getElementById('soundIcon');
                if (soundEnabled) {
                    icon.className = 'fa-solid fa-volume-high text-xl';
                } else {
                    icon.className = 'fa-solid fa-volume-xmark text-xl opacity-50';
                }
            });

            // 視窗調整大小處理
            window.addEventListener('resize', () => {
                setupCanvasResolution();
                drawWheel();
            });
        });
    </script>
</body>
</html>
