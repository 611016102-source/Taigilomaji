<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sio̍k-gān góa lóng chai - 俗諺我lóng知</title>
    <!-- Google Font: Iansui (芫荽) & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Iansui', 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-iansui {
            font-family: 'Iansui', serif;
        }

        /* Neon Glow Effects - Warm Retro Golden Glow */
        .neon-text-yellow {
            text-shadow: 0 0 6px #ffb703, 0 0 12px #d4a373, 0 0 20px #fb8500;
        }

        /* Marquee Bulbs - Vintage Retro Bulbs */
        .bulb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #5c4233;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        @media (min-width: 640px) {
            .bulb {
                width: 12px;
                height: 12px;
            }
        }
        .bulb.active-1 {
            background-color: #e63946;
            box-shadow: 0 0 8px #e63946, 0 0 14px #e63946;
        }
        .bulb.active-2 {
            background-color: #ffb703;
            box-shadow: 0 0 8px #ffb703, 0 0 14px #ffb703;
        }
        .bulb.active-3 {
            background-color: #2a9d8f;
            box-shadow: 0 0 8px #2a9d8f, 0 0 14px #2a9d8f;
        }

        /* 3D Machine Body - Vintage Teak Wood & Brass Border Craft Style */
        .slot-machine-body {
            background: linear-gradient(145deg, #4a2e1b, #28170c);
            box-shadow: 0 18px 38px rgba(45, 30, 24, 0.65), 0 0 0 3px #8c5e39, inset 0 2px 4px rgba(255, 230, 200, 0.25);
            border: 3px solid #b8860b;
        }

        /* Reel Window styling - Deep Warm Roasted Coffee Wood Frame */
        .reel-window {
            background: linear-gradient(to bottom, #1a0e07 0%, #2e180d 50%, #1a0e07 100%);
            box-shadow: inset 0 8px 18px rgba(0,0,0,0.95), inset 0 -8px 18px rgba(0,0,0,0.95), 0 0 12px rgba(92, 59, 33, 0.6);
            border: 3px solid #d4af37;
        }

        /* Glass reflection overlay */
        .glass-overlay {
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 40%, rgba(0,0,0,0) 41%, rgba(0,0,0,0.25) 100%);
            pointer-events: none;
        }

        /* Physical Lever Styling - Brass & Vintage Wood Knob */
        .lever-arm {
            transform-origin: bottom center;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lever-pulled .lever-arm {
            transform: rotateX(65deg) scaleY(0.7);
        }
        .lever-ball {
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.6), 0 0 12px rgba(184, 51, 42, 0.8);
            transition: transform 0.15s;
        }
        .lever-pulled .lever-ball {
            transform: translateY(80px) scale(0.9);
        }

        /* Motion blur during fast reel rotation */
        .blur-motion {
            filter: blur(3px);
        }

        /* Background grid pattern - Light Coffee Vintage Style */
        .bg-pattern {
            background-color: #ebdcd0;
            background-image: radial-gradient(#c5b19f 1.5px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-pattern h-screen h-[100dvh] text-slate-100 flex flex-col justify-between overflow-hidden relative">

        <div class="bg-[#24150c] border border-[#5c3e2b] rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">

    <!-- Modal 3: Proverb Result Image Modal (Warm Vintage Frame) -->

        <div class="relative bg-[#28170d] border-2 border-amber-500/60 rounded-2xl max-w-lg w-full p-4 flex flex-col items-center shadow-2xl overflow-hidden" onclick="event.stopPropagation()">

    <script>
        // The 5 Taiwanese Proverb items requested
        const FOOD_ITEMS = [
            "Ài ū kám-un ê sim",
            "Hêng-iông tăⁿ chai-iáⁿ hiáng-siū",
            "Chia̍h-pn̄g siōng tiōng-iàu",
            "Bē-sái kéng-chia̍h",
            "chia̍h-tio̍h hó-chia̍h--ê, ài kâng pò"
        ];

        // Mapping each proverb to its corresponding image
        const ITEM_IMAGES = {
            "Ài ū kám-un ê sim": "25.jpg",
            "Hêng-iông tăⁿ chai-iáⁿ hiáng-siū": "24.jpg",
            "Chia̍h-pn̄g siōng tiōng-iàu": "21.jpg",
            "Bē-sái kéng-chia̍h": "22.jpg",
            "chia̍h-tio̍h hó-chia̍h--ê, ài kâng pò": "23.jpg"
        };

        class BgmEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.enabled = true;
                this.timer = null;
                this.step = 0;

                this.notes = {
                    'G3': 196.00, 'A3': 220.00, 'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'G4': 392.00, 'A4': 440.00,
                    'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'G5': 783.99, 'OFF': 0
                };

                // Pentatonic folk style melody
                this.melody = [
                    'G4', 'A4', 'C5', 'D5', 'E5', 'D5', 'C5', 'A4',
                    'G4', 'C5', 'A4', 'G4', 'E4', 'G4', 'A4', 'C5'
                ];

                this.bass = [
                    'C4', 'C4', 'G3', 'G3', 'A3', 'A3', 'F4', 'G3',
                    'C4', 'C4', 'G3', 'G3', 'A3', 'A3', 'G3', 'C4'
                ];
            }

            init(audioCtx) {
                if (audioCtx) {
                    this.ctx = audioCtx;
                }
            }

            start() {
                if (this.isPlaying || !this.enabled || !this.ctx) return;
                
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                this.isPlaying = true;
                this.step = 0;
                
                const stepTime = 180;
                this.timer = setInterval(() => {
                    if (!this.isPlaying || !this.enabled) return;
                    this.playStep();
                    this.step = (this.step + 1) % 16;
                }, stepTime);
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) {
                    if (this.ctx) this.start();
                } else {
                    this.stop();
                }
                return this.enabled;
            }

            playStep() {
                if (!this.ctx || this.ctx.state !== 'running') return;
                const now = this.ctx.currentTime;

                const noteName = this.melody[this.step];
                if (noteName !== 'OFF' && this.notes[noteName]) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(this.notes[noteName], now);

                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);
                }

                if (this.step % 2 === 0) {
                    const bassNote = this.bass[this.step];
                    if (this.notes[bassNote]) {
                        const oscB = this.ctx.createOscillator();
                        const gainB = this.ctx.createGain();

                        oscB.type = 'sine';
                        oscB.frequency.setValueAtTime(this.notes[bassNote] / 2, now);

                        gainB.gain.setValueAtTime(0.04, now);
                        gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                        oscB.connect(gainB);
                        gainB.connect(this.ctx.destination);

                        oscB.start(now);
                        oscB.stop(now + 0.26);
                    }
                }
            }
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.noiseBuffer = null;
                this.enabled = true;
                this.bgm = new BgmEngine();
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.bgm.init(this.ctx);
                        this.createNoiseBuffer();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (this.bgm.enabled && !this.bgm.isPlaying) {
                    this.bgm.start();
                }
            }

            createNoiseBuffer() {
                if (!this.ctx || this.noiseBuffer) return;
                const bufferSize = this.ctx.sampleRate * 2; // 2 seconds audio noise
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                this.noiseBuffer = buffer;
            }

            playLeverSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // 1. Low mechanical heavy thud
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(35, now + 0.18);
                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);

                // 2. Mechanical latch / spring release noise
                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1400, now);
                    filter.Q.setValueAtTime(2.5, now);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.3, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                    noise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    noise.start(now);
                    noise.stop(now + 0.14);
                }
            }

            playTickSound(volumeScale = 1.0) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // Metallic gear ratchet click (dual high sine chimes)
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const clickGain = this.ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(1800 + Math.random() * 300, now);
                osc2.frequency.setValueAtTime(3200 + Math.random() * 400, now);

                clickGain.gain.setValueAtTime(0.07 * volumeScale, now);
                clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

                osc1.connect(clickGain);
                osc2.connect(clickGain);
                clickGain.connect(this.ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.035);
                osc2.stop(now + 0.035);

                // Highpass mechanical noise burst
                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(2800, now);

                    const nGain = this.ctx.createGain();
                    nGain.gain.setValueAtTime(0.12 * volumeScale, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(this.ctx.destination);
                    noise.start(now);
                    noise.stop(now + 0.025);
                }
            }

            playStopSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                // Deep low mechanical lock thump
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(28, now + 0.16);
                gain.gain.setValueAtTime(0.55, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.16);

                // Metallic latch click on stop
                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1800, now);
                    filter.Q.setValueAtTime(3.5, now);

                    const nGain = this.ctx.createGain();
                    nGain.gain.setValueAtTime(0.4, now);
                    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(this.ctx.destination);

                    noise.start(now);
                    noise.stop(now + 0.09);
                }
            }

            playCoinCascade() {
                if (!this.enabled || !this.ctx) return;

                // Simulate 22 individual coins dropping & clinking in metal tray
                const coinCount = 22;
                for (let i = 0; i < coinCount; i++) {
                    const delay = Math.pow(i / coinCount, 1.2) * 1.5 + (Math.random() * 0.05);
                    const now = this.ctx.currentTime + delay;

                    // Metallic resonant chime frequency
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    const freqs = [3200, 3800, 4300, 4900, 5600, 6400];
                    const freq = freqs[Math.floor(Math.random() * freqs.length)] + (Math.random() * 200 - 100);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    const vol = 0.08 + Math.random() * 0.06;
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08 + Math.random() * 0.05);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);

                    if (this.noiseBuffer) {
                        const noise = this.ctx.createBufferSource();
                        noise.buffer = this.noiseBuffer;
                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.setValueAtTime(freq, now);
                        filter.Q.setValueAtTime(7, now);

                        const nGain = this.ctx.createGain();
                        nGain.gain.setValueAtTime(vol * 0.8, now);
                        nGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);

                        noise.connect(filter);
                        filter.connect(nGain);
                        nGain.connect(this.ctx.destination);

                        noise.start(now);
                        noise.stop(now + 0.05);
                    }
                }
            }

            playWinSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // Bright casino fanfare pentatonic glockenspiel
                const arpeggio = [
                    { note: 523.25, time: 0.0, dur: 0.2 },  // C5
                    { note: 659.25, time: 0.1, dur: 0.2 },  // E5
                    { note: 783.99, time: 0.2, dur: 0.25 }, // G5
                    { note: 1046.50, time: 0.32, dur: 0.6 },// C6
                    { note: 1318.51, time: 0.45, dur: 0.7 } // E6
                ];

                arpeggio.forEach(({ note, time, dur }) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note, now + time);

                    gain.gain.setValueAtTime(0.22, now + time);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + time + dur);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + time);
                    osc.stop(now + time + dur);
                });

                // Trigger coin drop cascade effect
                this.playCoinCascade();
            }
        }

        const sounds = new SoundEngine();

        // Global App State
        let isSpinning = false;
        let spinHistory = [];
        let bulbPhase = 0;
        let bulbInterval = null;
        let currentItemIndex = 0;
        let hasResult = false;
        let isImageOpen = false;

        // DOM Element references
        const reelContainer = document.getElementById('reelContainer');
        const reelWindow = document.getElementById('reelWindow');
        const leverAssembly = document.getElementById('leverAssembly');
        const menuModal = document.getElementById('menuModal');
        const historyModal = document.getElementById('historyModal');

        function getItemHeight() {
            return reelWindow ? reelWindow.clientHeight : 160;
        }

        function buildReelDOM() {
            reelContainer.innerHTML = '';
            const itemHeight = getItemHeight();
            
            const extendedList = [];
            // Duplicate list 20 times for high-speed multi-revolution scrolling
            for (let i = 0; i < 20; i++) {
                extendedList.push(...FOOD_ITEMS);
            }

            extendedList.forEach((item) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'w-full flex items-center justify-center px-2 text-center flex-shrink-0';
                itemEl.style.height = `${itemHeight}px`;
                
                // Dynamically scale font size based on text length to maximize size without overflowing
                let fontSizeClass = 'text-xl sm:text-3xl md:text-4xl lg:text-5xl';
                if (item.length > 28) {
                    fontSizeClass = 'text-base sm:text-2xl md:text-3xl lg:text-4xl';
                } else if (item.length > 20) {
                    fontSizeClass = 'text-lg sm:text-2xl md:text-3xl lg:text-4xl';
                }

                itemEl.innerHTML = `
                    <div class="${fontSizeClass} font-extrabold text-amber-300 font-iansui leading-snug tracking-tight whitespace-nowrap max-w-full px-1 overflow-hidden text-ellipsis">${item}</div>
                `;
                reelContainer.appendChild(itemEl);
            });
            
            setReelPosition(10, false);
        }

        function setReelPosition(index, animate = false) {
            const itemHeight = getItemHeight();
            const targetY = -(index * itemHeight);
            
            if (!animate) {
                reelContainer.style.transition = 'none';
            }
            reelContainer.style.transform = `translateY(${targetY}px)`;
        }

        function initBulbs() {
            const topBulbs = document.querySelectorAll('#topBulbs .bulb');
            const bottomBulbs = document.querySelectorAll('#bottomBulbs .bulb');
            const allBulbs = [...topBulbs, ...bottomBulbs];

            bulbInterval = setInterval(() => {
                bulbPhase = (bulbPhase + 1) % 3;
                allBulbs.forEach((bulb, idx) => {
                    bulb.classList.remove('active-1', 'active-2', 'active-3');
                    if ((idx + bulbPhase) % 3 === 0) {
                        bulb.classList.add('active-1');
                    } else if ((idx + bulbPhase) % 3 === 1) {
                        bulb.classList.add('active-2');
                    } else {
                        bulb.classList.add('active-3');
                    }
                });
            }, 300);
        }

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            sounds.init();
            sounds.playLeverSound();

            triggerLeverAnimation();

            const targetFoodIndex = Math.floor(Math.random() * FOOD_ITEMS.length);
            const targetFood = FOOD_ITEMS[targetFoodIndex];
            currentItemIndex = targetFoodIndex;

            // Target cycle 12 for dramatic multi-rotation rapid spinning (60+ items passing)
            const targetDOMIndex = (12 * FOOD_ITEMS.length) + targetFoodIndex;

            reelContainer.classList.add('blur-motion');

            const totalSpinDuration = 3500;
            let elapsedTime = 0;
            let currentInterval = 120;

            // High speed ticking audio simulation
            while (elapsedTime < totalSpinDuration - 400) {
                const progress = elapsedTime / totalSpinDuration;
                if (progress < 0.15) {
                    currentInterval = Math.max(22, currentInterval * 0.62); // Fast acceleration
                } else if (progress > 0.65) {
                    currentInterval = currentInterval * 1.24; // Smooth realistic braking
                } else {
                    currentInterval = 22; // High-speed spin phase (sub-25ms fast clicking)
                }

                const delay = elapsedTime;
                setTimeout(() => {
                    sounds.playTickSound(progress > 0.7 ? 1.3 : 0.85);
                }, delay);

                elapsedTime += currentInterval;
            }

            setTimeout(() => {
                // Smooth physical inertia easing curve for stopping
                reelContainer.style.transition = 'transform 3.5s cubic-bezier(0.08, 0.88, 0.18, 1)';
                setReelPosition(targetDOMIndex, true);
            }, 50);

            setTimeout(() => {
                reelContainer.classList.remove('blur-motion');
                
                // Mechanical reel stop thud
                sounds.playStopSound();

                // Win fanfare + metallic coin shower
                setTimeout(() => {
                    sounds.playWinSound();
                    triggerConfetti();
                }, 120);

                addToHistory(targetFood);

                setTimeout(() => {
                    setReelPosition(10 + targetFoodIndex, false);
                }, 100);

                isSpinning = false;
                hasResult = true; // Set flag so the next click shows the image popup
            }, 3600);
        }

        function showImageModal(proverbName) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('proverbImage');
            const title = document.getElementById('imageModalTitle');

            const imgSrc = ITEM_IMAGES[proverbName] || '22.jpg';
            img.src = imgSrc;
            title.textContent = proverbName;

            modal.classList.remove('hidden');
            isImageOpen = true;
        }

        function closeImageModal(e) {
            if (e) e.stopPropagation();
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            isImageOpen = false;
        }

        function triggerLeverAnimation() {
            leverAssembly.classList.add('lever-pulled');
            setTimeout(() => {
                leverAssembly.classList.remove('lever-pulled');
            }, 300);
        }

        function addToHistory(food) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            spinHistory.unshift({
                name: food,
                time: timeStr
            });
            updateHistoryModal();
        }

        function updateHistoryModal() {
            const countEl = document.getElementById('historyCount');
            const listEl = document.getElementById('historyListContent');
            
            countEl.textContent = spinHistory.length;

            if (spinHistory.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-6 text-amber-200/50 font-iansui text-sm">
                        <i class="fas fa-dice text-2xl mb-1 block"></i>
                        尚無拉霸紀錄
                    </div>
                `;
                return;
            }

            listEl.innerHTML = spinHistory.map((item) => `
                <div class="bg-[#170c07] p-2.5 rounded-xl border border-[#472c1c] flex items-center justify-between">
                    <div>
                        <div class="text-amber-300 font-bold text-base leading-tight font-iansui">${item.name}</div>
                        <div class="text-[10px] text-amber-200/50">${item.time}</div>
                    </div>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">抽中</span>
                </div>
            `).join('');
        }

        function renderFoodListModal() {
            const listEl = document.getElementById('foodListContent');
            listEl.innerHTML = FOOD_ITEMS.map((food, idx) => `
                <div class="pt-2.5 first:pt-0 flex items-center gap-2.5">
                    <div class="w-6 h-6 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-400 font-bold text-xs flex items-center justify-center flex-shrink-0">
                        ${idx + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-base sm:text-lg font-bold text-amber-300 font-iansui block break-words">${food}</span>
                    </div>
                </div>
            `).join('');
        }

        // Confetti Canvas Particle Generator
        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ffb703', '#fb8500', '#05d9e8', '#ff2a6d', '#e0aaff'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }

            let animationFrame;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3; // Gravity
                    p.opacity -= 0.015;
                    p.rotation += p.rSpeed;

                    if (p.opacity > 0) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.globalAlpha = Math.max(0, p.opacity);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (alive) {
                    animationFrame = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }

            render();
        }

        // Initialize application listeners
        window.addEventListener('DOMContentLoaded', () => {
            buildReelDOM();
            initBulbs();
            renderFoodListModal();
            updateHistoryModal();

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    buildReelDOM();
                });
            }

            const clickArea = document.getElementById('clickAnywhereArea');
            clickArea.addEventListener('click', () => {
                if (isSpinning) return;

                if (isImageOpen) {
                    closeImageModal();
                    return;
                }

                if (hasResult) {
                    showImageModal(FOOD_ITEMS[currentItemIndex]);
                    hasResult = false;
                    return;
                }

                startSpin();
            });

            document.getElementById('bgmToggleBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                sounds.init();
                const enabled = sounds.bgm.toggle();
                const icon = document.getElementById('bgmIcon');
                if (enabled) {
                    icon.className = 'fas fa-music text-base md:text-lg text-amber-400';
                } else {
                    icon.className = 'fas fa-slash text-base md:text-lg text-slate-500';
                }
            });

            document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                sounds.enabled = !sounds.enabled;
                const icon = document.getElementById('soundIcon');
                if (sounds.enabled) {
                    icon.className = 'fas fa-volume-up text-base md:text-lg text-amber-400';
                } else {
                    icon.className = 'fas fa-volume-mute text-base md:text-lg text-slate-500';
                }
            });

            document.getElementById('menuBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                menuModal.classList.remove('hidden');
            });

            document.getElementById('historyBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                historyModal.classList.remove('hidden');
            });

            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuModal.classList.add('hidden');
                    historyModal.classList.add('hidden');
                    closeImageModal(e);
                });
            });

            document.getElementById('clearHistoryBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                spinHistory = [];
                updateHistoryModal();
            });

            window.addEventListener('resize', () => {
                buildReelDOM();
            });
        });
    </script>
</body>
</html>
