    <style>
        /* CSS Dual-Channel Font-Face Declaration */
        @font-face {
            font-family: 'Iansui';
            src: url('https://cdn.jsdelivr.net/gh/cmex-tw/iansui/webfont/iansui.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/cmex-tw/iansui/webfont/iansui.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Iansui', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Viewport & CSS Variable Setup */
        :root {
            --item-h: clamp(140px, 38vh, 400px);
        }

        @media (max-width: 640px) {
            :root {
                --item-h: clamp(110px, 25vh, 200px);
            }
        }

        /* Royal Amethyst Radial Gradient Background */
        .bg-royal-amethyst {
            background: radial-gradient(circle at 50% 35%, #7e22ce 0%, #581c87 35%, #3b0764 70%, #090514 100%);
        }

        /* Text Glowing Effects */
        .neon-gold-text {
            color: #fef08a;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8),
                         0 0 20px rgba(234, 179, 8, 0.6),
                         0 0 35px rgba(202, 138, 4, 0.4);
        }

        .purple-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.6), 
                        inset 0 0 15px rgba(192, 132, 252, 0.4);
        }

        /* Slot Reel Cards & Font Scaling */
        .reel-viewport {
            height: var(--item-h);
            perspective: 1000px;
        }

        .reel-card {
            height: var(--item-h);
            padding-bottom: 0.12em; /* Bottom padding offset for p, j, g, ⁿ */
        }

        /* Dynamic Font Sizes relative to --item-h */
        .font-len-1 { font-size: calc(var(--item-h) * 0.76); line-height: 1; }
        .font-len-2 { font-size: calc(var(--item-h) * 0.63); line-height: 1; }
        .font-len-3 { font-size: calc(var(--item-h) * 0.50); line-height: 1; }
        .font-len-4 { font-size: calc(var(--item-h) * 0.40); line-height: 1; }
        .font-len-welcome { font-size: calc(var(--item-h) * 0.22); line-height: 1.1; }

        /* Smooth Reel Animation CSS */
        .reel-strip {
            transition: transform 2s cubic-bezier(0.15, 0.85, 0.35, 1.05);
            will-change: transform;
        }

        /* Blinking LED Lights Effect */
        @keyframes blink-pink {
            0%, 100% { background-color: #ec4899; box-shadow: 0 0 8px #ec4899; }
            50% { background-color: #831843; box-shadow: none; }
        }
        @keyframes blink-purple {
            0%, 100% { background-color: #c084fc; box-shadow: 0 0 8px #c084fc; }
            50% { background-color: #581c87; box-shadow: none; }
        }

        .led-pink { animation: blink-pink 1.2s infinite alternate; }
        .led-purple { animation: blink-purple 1.2s infinite alternate-reverse; }

        /* Custom Scrollbar for Settings & Overlay */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a855f7;
            border-radius: 4px;

            50% { opacity: 1; transform: scale(1.03); }
        }
        .btn-pulse {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>

    <!-- ==================== JAVASCRIPT LOGIC & WEB AUDIO ENGINE ==================== -->
    <script>
        /**
         * DEFAULT EDUCATIONAL DATA (Left and Right Reels - Pe̍h-ōe-jī Initials & Finals)
         */
        const DEFAULT_LEFT = ["p", "ph", "m", "b", "t", "th", "n", "l", "k", "kh", "h", "g", "ng", "ch", "chh", "s", "j"];
        const DEFAULT_RIGHT = ["a", "i", "u", "o͘", "e", "o"];

        // Isolated Storage Keys (Updated version suffix to apply new defaults cleanly)
        const STORAGE_KEY_LEFT = 'slot_left_poj_v2';
        const STORAGE_KEY_RIGHT = 'slot_right_poj_v2';

        // State Machine Variables
        let leftItems = [];
        let rightItems = [];
        let currentStep = 0; // 0 to 20
        let currentCyclePhase = 'READY'; // 'READY', 'SPINNING', 'CELEBRATED'
        let hoverZone = 'NONE'; // 'LEFT', 'RIGHT', 'NONE'
        let isSettingsOpen = false;
        let isChartOpen = false;

        // Current Target Indexes
        let targetLeftIdx = 0;
        let targetRightIdx = 0;

        // Reel Strips State
        let leftStripElements = [];
        let rightStripElements = [];

        // WEB AUDIO API ENGINE & BGM PRESET
        let audioCtx = null;
        let isBgmOn = true;
        let bgmTimer = null;
        let bgmStep = 0;

        // Synthesized Arcade Chords Array
        const ARCADE_MELODY = [
            { note: 261.63, dur: 0.15 }, // C4
            { note: 329.63, dur: 0.15 }, // E4
            { note: 392.00, dur: 0.15 }, // G4
            { note: 523.25, dur: 0.20 }, // C5
            { note: 392.00, dur: 0.15 }, // G4
            { note: 523.25, dur: 0.30 }, // C5
        ];

        /**
         * Initialize Audio Context safely
         */
        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        /**
         * Sound 1: Spin Tick Effect (0.03s Sine Decay 650Hz -> 1200Hz)
         */
        function playSpinTick() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.03);
                
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + 0.03);
            } catch(e) {}
        }

        /**
         * Sound 2: Victory Chords Effect (C4, E4, G4, C5 Arpeggio)
         */
        function playVictoryChords() {
            if (!audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            const now = audioCtx.currentTime;
            
            notes.forEach((freq, idx) => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    
                    gain.gain.setValueAtTime(0, now + idx * 0.07);
                    gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.07 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.3);
                } catch(e) {}
            });
        }

        /**
         * UI Click Tick Sound
         */
        function playClickTick() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } catch(e) {}
        }

        /**
         * Background Arcade Music Loop Engine
         */
        function startBgmLoop() {
            if (bgmTimer) clearInterval(bgmTimer);
            bgmTimer = setInterval(() => {
                if (!isBgmOn || !audioCtx) return;
                const noteObj = ARCADE_MELODY[bgmStep % ARCADE_MELODY.length];
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(noteObj.note, audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + noteObj.dur);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + noteObj.dur);
                } catch(e) {}
                bgmStep++;
            }, 260);
        }

        /**
         * Determine Dynamic Font Size Class based on string length
         */
        function getFontClass(str) {
            if (!str) return 'font-len-1';
            const len = str.length;
            if (str.includes('Chún') || str.includes('Oân')) return 'font-len-welcome';
            if (len <= 1) return 'font-len-1';
            if (len === 2) return 'font-len-2';
            if (len === 3) return 'font-len-3';
            return 'font-len-4';
        }

        /**
         * Load Initial Data from LocalStorage
         */
        function loadData() {
            const rawLeft = localStorage.getItem(STORAGE_KEY_LEFT);
            const rawRight = localStorage.getItem(STORAGE_KEY_RIGHT);

            leftItems = rawLeft ? JSON.parse(rawLeft) : [...DEFAULT_LEFT];
            rightItems = rawRight ? JSON.parse(rawRight) : [...DEFAULT_RIGHT];

            if (!leftItems || leftItems.length === 0) leftItems = [...DEFAULT_LEFT];
            if (!rightItems || rightItems.length === 0) rightItems = [...DEFAULT_RIGHT];
        }

        /**
         * Build Reel Strip DOM Structure (Pure CSS Percentage Translation Support)
         */
        function buildReelStrips() {
            const stripLeft = document.getElementById('strip-left');
            const stripRight = document.getElementById('strip-right');

            // Build Left Strip: Initial Welcome Word -> Reel Items -> Duplicate for seamless scroll
            const leftList = ["Chún-pī", ...leftItems, ...leftItems, ...leftItems];
            stripLeft.innerHTML = leftList.map(item => `
                <div class="reel-card w-full flex items-center justify-center font-black ${getFontClass(item)} transition-all">
                    ${item}
                </div>
            `).join('');

            // Build Right Strip
            const rightList = ["Chún-pī", ...rightItems, ...rightItems, ...rightItems];
            stripRight.innerHTML = rightList.map(item => `
                <div class="reel-card w-full flex items-center justify-center font-black ${getFontClass(item)} transition-all">
                    ${item}
                </div>
            `).join('');

            leftStripElements = leftList;
            rightStripElements = rightList;

            // Reset translateY positions to 0% (Welcome state)
            stripLeft.style.transform = 'translateY(0%)';
            stripRight.style.transform = 'translateY(0%)';
        }

        /**
         * Render 20 Progress Dots at the bottom
         */
        function renderProgressDots() {
            const container = document.getElementById('progress-dots-container');
            const textEl = document.getElementById('progress-text');
            textEl.innerText = `${currentStep} / 20`;

            let html = '';
            for (let i = 1; i <= 20; i++) {
                if (i <= currentStep) {
                    html += `<div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b] border border-amber-200 transition-all scale-110"></div>`;
                } else {
                    html += `<div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-purple-950/80 border border-purple-600/50 transition-all"></div>`;
                }
            }
            container.innerHTML = html;
        }

        /**
         * Render Reference Chart Overlay (90% Micro scale, No-Wrap layout)
         */
        function renderChartOverlay() {
            const listLeft = document.getElementById('chart-list-left');
            const listRight = document.getElementById('chart-list-right');

            listLeft.innerHTML = leftItems.map(item => `
                <div onclick="playClickTick()" class="bg-purple-950/80 hover:bg-amber-400 hover:text-purple-950 border border-purple-400/40 rounded-xl p-2 text-center transition cursor-pointer font-black min-h-[90px] flex items-center justify-center overflow-hidden whitespace-nowrap shadow">
                    <span class="${getFontClass(item)} tracking-wide">${item}</span>
                </div>
            `).join('');

            listRight.innerHTML = rightItems.map(item => `
                <div onclick="playClickTick()" class="bg-purple-950/80 hover:bg-amber-400 hover:text-purple-950 border border-purple-400/40 rounded-xl p-2 text-center transition cursor-pointer font-black min-h-[90px] flex items-center justify-center overflow-hidden whitespace-nowrap shadow">
                    <span class="${getFontClass(item)} tracking-wide">${item}</span>
                </div>
            `).join('');
        }

        /**
         * Pure CSS Percentage Translation Spin Engine
         * Formula: translateY(-( (M - 1) / M ) * 100%)
         */
        function spinReel(side, targetIndex) {
            const strip = side === 'left' ? document.getElementById('strip-left') : document.getElementById('strip-right');
            const totalItems = side === 'left' ? leftStripElements.length : rightStripElements.length;
            const listLen = side === 'left' ? leftItems.length : rightItems.length;

            // Reset transition briefly to snap back to top cycle seamlessly
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0%)';
            
            // Force DOM reflow
            void strip.offsetWidth;

            // Re-enable smooth 2.0s cubic-bezier spin
            strip.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.35, 1.05)';

            // Land on the 3rd repetition block (index 1 + listLen*2 + targetIndex)
            const landPositionIndex = 1 + (listLen * 2) + targetIndex;
            const M = totalItems;
            const percentage = -((landPositionIndex) / M) * 100;

            // Trigger Spin Ticks sound during reel movement (2.0 seconds duration)
            let ticksCount = 0;
            const tickInterval = setInterval(() => {
                playSpinTick();
                ticksCount++;
                if (ticksCount >= 16) clearInterval(tickInterval);
            }, 115);

            strip.style.transform = `translateY(${percentage}%)`;
        }

        /**
         * Spin a single reel individually for 2 seconds with shield protection
         */
        function spinSingleSide(side) {
            if (isSettingsOpen || isChartOpen || currentCyclePhase === 'SPINNING') return;
            initAudio();

            const shield = document.getElementById('spin-shield');
            const prevPhase = currentCyclePhase;
            currentCyclePhase = 'SPINNING';
            shield.classList.remove('hidden');

            if (side === 'left') {
                targetLeftIdx = Math.floor(Math.random() * leftItems.length);
                spinReel('left', targetLeftIdx);
            } else {
                targetRightIdx = Math.floor(Math.random() * rightItems.length);
                spinReel('right', targetRightIdx);
            }

            setTimeout(() => {
                currentCyclePhase = prevPhase;
                shield.classList.add('hidden');
            }, 2000);
        }

        /**
         * Execution of 3-Phase Classroom Control Loop
         */
        function handleMainCycle() {
            if (isSettingsOpen || isChartOpen || currentCyclePhase === 'SPINNING') return;
            initAudio();

            const shield = document.getElementById('spin-shield');

            // --- HOVER INDIVIDUAL SPIN MODE ---
            if (hoverZone === 'LEFT') {
                spinSingleSide('left');
                return;
            }
            if (hoverZone === 'RIGHT') {
                spinSingleSide('right');
                return;
            }

            // --- SYNCHRONIZED DUAL SPIN CYCLE MODE ---
            if (currentCyclePhase === 'READY') {
                // Phase 1: Start Spinning (2.0 seconds)
                currentCyclePhase = 'SPINNING';
                shield.classList.remove('hidden');

                // Pick random targets for both slots
                targetLeftIdx = Math.floor(Math.random() * leftItems.length);
                targetRightIdx = Math.floor(Math.random() * rightItems.length);

                spinReel('left', targetLeftIdx);
                spinReel('right', targetRightIdx);

                // Stop after 2.0s and reveal answer
                setTimeout(() => {
                    currentCyclePhase = 'SPINNED_WAIT';
                    shield.classList.add('hidden');
                }, 2000);

            } else if (currentCyclePhase === 'SPINNED_WAIT') {
                // Phase 2: Celebrate & Score
                currentCyclePhase = 'CELEBRATED';
                
                // Trigger Confetti Burst
                try {
                    confetti({
                        particleCount: 75,
                        spread: 70,
                        origin: { y: 0.65 }
                    });
                } catch(e) {}

                playVictoryChords();

                // Increment Progress Step (max 20)
                if (currentStep < 20) {
                    currentStep++;
                    renderProgressDots();
                }

            } else if (currentCyclePhase === 'CELEBRATED') {
                // Phase 3: Next Question Start
                currentCyclePhase = 'READY';
                handleMainCycle(); // Chain directly to phase 1
            }
        }

        /**
         * EVENT LISTENERS & SETUP
         */
        function setupEventListeners() {
            // Screen Start Audio Overlay Click
            const overlay = document.getElementById('audio-start-overlay');
            overlay.addEventListener('click', (e) => {
                e.stopPropagation();
                initAudio();
                startBgmLoop();
                overlay.classList.add('hidden');
            });

            // Blank Area / Global Screen Click -> Trigger Dual Reel 2-Second Cycle
            document.body.addEventListener('click', (e) => {
                // Ignore clicks if audio overlay is still visible or modals are open
                if (!overlay.classList.contains('hidden')) return;
                if (isSettingsOpen || isChartOpen) return;

                // Ignore clicks on buttons, inputs, or inside overlays
                if (e.target.closest('button') || e.target.closest('#overlay-chart') || e.target.closest('#overlay-settings')) {
                    return;
                }

                // Trigger dual spin cycle (hoverZone is NONE when clicking blank area)
                handleMainCycle();
            });

            // Hover Zones Detection & Individual 2-Second Click Spin
            const zoneLeft = document.getElementById('zone-left');
            const zoneRight = document.getElementById('zone-right');

            zoneLeft.addEventListener('mouseenter', () => hoverZone = 'LEFT');
            zoneLeft.addEventListener('mouseleave', () => hoverZone = 'NONE');
            zoneLeft.addEventListener('click', (e) => {
                e.stopPropagation();
                spinSingleSide('left');
            });

            zoneRight.addEventListener('mouseenter', () => hoverZone = 'RIGHT');
            zoneRight.addEventListener('mouseleave', () => hoverZone = 'NONE');
            zoneRight.addEventListener('click', (e) => {
                e.stopPropagation();
                spinSingleSide('right');
            });

            // Global Keydown Handler (Presenter Clicker / Keyboard Support)
            window.addEventListener('keydown', (e) => {
                // Safe Input Lock Guard: Pause listener when settings/inputs are focused or chart is open
                if (isSettingsOpen || isChartOpen) return;
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag === 'input' || activeTag === 'textarea') return;

                // Presenter Pen keys: PageUp, PageDown, Space, Enter, Arrow Keys
                const validKeys = ['PageUp', 'PageDown', ' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                if (validKeys.includes(e.key)) {
                    e.preventDefault();
                    handleMainCycle();
                }
            });

            // Reference Chart Panel Controls
            const chartOverlay = document.getElementById('overlay-chart');
            document.getElementById('btn-open-chart').addEventListener('click', () => {
                playClickTick();
                isChartOpen = true;
                renderChartOverlay();
                chartOverlay.classList.remove('hidden');
                chartOverlay.classList.add('flex');
            });

            document.getElementById('btn-close-chart').addEventListener('click', () => {
                playClickTick();
                isChartOpen = false;
                chartOverlay.classList.add('hidden');
                chartOverlay.classList.remove('flex');
            });

            // Custom Settings Panel Controls
            const settingsOverlay = document.getElementById('overlay-settings');
            const inputLeft = document.getElementById('input-left-data');
            const inputRight = document.getElementById('input-right-data');

            document.getElementById('btn-open-settings').addEventListener('click', () => {
                playClickTick();
                isSettingsOpen = true;
                inputLeft.value = leftItems.join(',');
                inputRight.value = rightItems.join(',');
                settingsOverlay.classList.remove('hidden');
                settingsOverlay.classList.add('flex');
            });

            document.getElementById('btn-close-settings').addEventListener('click', () => {
                playClickTick();
                isSettingsOpen = false;
                settingsOverlay.classList.add('hidden');
                settingsOverlay.classList.remove('flex');
            });

            // Save Settings
            document.getElementById('btn-save-settings').addEventListener('click', () => {
                playClickTick();
                const parsedLeft = inputLeft.value.split(',').map(s => s.trim()).filter(Boolean);
                const parsedRight = inputRight.value.split(',').map(s => s.trim()).filter(Boolean);

                if (parsedLeft.length > 0 && parsedRight.length > 0) {
                    leftItems = parsedLeft;
                    rightItems = parsedRight;

                    // Parallel Isolated LocalStorage
                    localStorage.setItem(STORAGE_KEY_LEFT, JSON.stringify(leftItems));
                    localStorage.setItem(STORAGE_KEY_RIGHT, JSON.stringify(rightItems));

                    buildReelStrips();
                    isSettingsOpen = false;
                    settingsOverlay.classList.add('hidden');
                    settingsOverlay.classList.remove('flex');
                }
            });

            // Reset Default Settings
            document.getElementById('btn-reset-default').addEventListener('click', () => {
                playClickTick();
                leftItems = [...DEFAULT_LEFT];
                rightItems = [...DEFAULT_RIGHT];
                inputLeft.value = leftItems.join(',');
                inputRight.value = rightItems.join(',');

                localStorage.removeItem(STORAGE_KEY_LEFT);
                localStorage.removeItem(STORAGE_KEY_RIGHT);

                buildReelStrips();
            });

            // BGM Toggle Button
            const bgmBtn = document.getElementById('btn-toggle-bgm');
            const bgmInd = document.getElementById('bgm-indicator');
            const bgmTxt = document.getElementById('bgm-text');

            bgmBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                initAudio();
                isBgmOn = !isBgmOn;
                if (isBgmOn) {
                    bgmInd.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                    bgmTxt.innerText = '🎶 電玩風';
                    startBgmLoop();
                } else {
                    bgmInd.className = 'w-2.5 h-2.5 rounded-full bg-gray-500';
                    bgmTxt.innerText = '🔇 已靜音';
                    if (bgmTimer) clearInterval(bgmTimer);
                }
            });
        }

        /**
         * DOM Initializer
         */
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            buildReelStrips();
            renderProgressDots();
            setupEventListeners();
        });
    </script>
</body>
</html>
