<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果子講看覓</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fallback base styling in case CDN is blocked */
        body {
            background-color: #020617 !important;
            color: #ffffff !important;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-between p-4 sm:p-6 select-none overflow-x-hidden font-sans">

    <!-- Top Navigation / Header -->
    <header class="w-full max-w-4xl flex items-center justify-between py-2 border-b border-slate-800">
        <h1 class="text-3xl sm:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-300 via-orange-400 to-rose-400 tracking-wider">
            果子講看覓
        </h1>
        
        <!-- Round Info & Custom Upload Button -->
        <div class="flex items-center space-x-3">
            <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-center">
                <span class="text-xs text-slate-400 block font-bold">輪次</span>
                <span id="round-count" class="text-lg sm:text-xl font-black text-amber-400">第 1 輪</span>
            </div>
            <div class="bg-slate-900 border border-slate-800 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl text-center">
                <span class="text-xs text-slate-400 block font-bold">剩餘</span>
                <span id="remaining-count" class="text-lg sm:text-xl font-black text-emerald-400">17 / 17</span>
            </div>
            <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 active:scale-95 transition px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl border border-slate-700 flex items-center space-x-1.5 text-xs sm:text-sm font-bold text-slate-200 shadow-md">
                <span>📁 上傳圖片</span>
                <input type="file" id="image-uploader" multiple accept="image/*" style="display:none !important;" class="hidden">
            </label>
        </div>
    </header>

    <!-- Main Content: Big Pure Fruit Display Frame (Click Anywhere to Spin) -->
    <main id="click-area" class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center my-6 cursor-pointer group">
        
        <!-- Fruit Display Card Area (Wider Aspect Ratio) -->
        <div class="w-full h-[320px] sm:h-[420px] max-w-4xl bg-slate-900/90 rounded-3xl border-4 border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden relative group-hover:border-amber-400/50 transition-all duration-300">
            
            <!-- Reel Slot Machine Strip -->
            <div id="reel-strip" class="w-full flex flex-col items-center">
                <!-- Fruit Card Content will be rendered dynamically -->
            </div>
        </div>

    </main>

    <!-- Bottom Round History Tray -->
    <footer class="w-full max-w-4xl bg-slate-900/80 backdrop-blur border border-slate-800/80 rounded-2xl p-3 sm:p-4">
        <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-400 tracking-wider">本輪已出現過的果子</span>
            <span id="history-counter" class="text-xs text-slate-500 font-mono">0 / 17</span>
        </div>
        <div id="history-container" class="flex items-center space-x-2 overflow-x-auto py-1 min-h-[52px] scrollbar-none">
            <span id="history-empty" class="text-xs text-slate-600 italic">點擊畫面上方轉動水果...</span>
        </div>
    </footer>

    <!-- JavaScript Engine -->
    <script>
        // 64 ~ 80 Fruit IDs List (Total 17 items)
        const ALL_FRUITS = [64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80];
        
        // Emoji & Label fallback dictionary for fruits
        const FRUIT_METADATA = {
            64: { emoji: '🍎', name: '蘋果', color: 'from-red-500 to-rose-600' },
            65: { emoji: '🍌', name: '香蕉', color: 'from-amber-400 to-yellow-500' },
            66: { emoji: '🍇', name: '葡萄', color: 'from-purple-500 to-indigo-600' },
            67: { emoji: '🍉', name: '西瓜', color: 'from-emerald-500 to-green-600' },
            68: { emoji: '🍓', name: '草莓', color: 'from-pink-500 to-rose-500' },
            69: { emoji: '🍒', name: '櫻桃', color: 'from-rose-600 to-red-700' },
            70: { emoji: '🍑', name: '水蜜桃', color: 'from-orange-300 to-pink-400' },
            71: { emoji: '🍍', name: '鳳梨', color: 'from-yellow-400 to-amber-500' },
            72: { emoji: '檸檬', emoji: '🍋', color: 'from-yellow-300 to-lime-400' },
            73: { emoji: '🍊', name: '橘子', color: 'from-orange-400 to-amber-600' },
            74: { emoji: '🍐', name: '西洋梨', color: 'from-lime-400 to-emerald-500' },
            75: { emoji: '木瓜', emoji: '🍈', color: 'from-orange-500 to-yellow-600' },
            76: { emoji: '🥝', name: '奇異果', color: 'from-lime-600 to-green-700' },
            77: { emoji: '🥭', name: '芒果', color: 'from-amber-400 to-orange-500' },
            78: { emoji: '椰子', emoji: '🥥', color: 'from-stone-600 to-stone-800' },
            79: { emoji: '🥑', name: '酪梨', color: 'from-emerald-700 to-green-900' },
            80: { emoji: '番茄', emoji: '🍅', color: 'from-red-600 to-rose-700' }
        };

        // Custom uploaded image map (ID -> base64/url)
        const customImages = {};
        
        // 預設自動提取 64.png ~ 80.png 圖片檔名
        ALL_FRUITS.forEach(id => {
            customImages[id] = `${id}.png`;
        });

        // Shuffle & Round State
        let pool = [];
        let currentRound = 1;
        let roundHistory = [];
        let isSpinning = false;
        let soundAudioCtx = null;

        // Initialize Audio Context on user click
        function initAudio() {
            if (!soundAudioCtx) {
                soundAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Web Audio synthesized sound generator
        function playTone(freq, duration, type = 'sine') {
            if (!soundAudioCtx) return;
            try {
                const osc = soundAudioCtx.createOscillator();
                const gain = soundAudioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, soundAudioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, soundAudioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, soundAudioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(soundAudioCtx.destination);
                osc.start();
                osc.stop(soundAudioCtx.currentTime + duration);
            } catch (e) {}
        }

        // Fisher-Yates Shuffle
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Reset or init new round pool
        function initPool() {
            pool = shuffle(ALL_FRUITS);
            roundHistory = [];
            updateUIState();
            renderInitialCard();
        }

        // Render standard card element
        function createCardElement(id) {
            const meta = FRUIT_METADATA[id] || { emoji: '🍎', name: `圖片 ${id}`, color: 'from-slate-700 to-slate-800' };
            const imgSrc = customImages[id] || `${id}.png`;

            const contentHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center bg-slate-900 p-2 relative">
                    <img src="${imgSrc}" alt="${id}.png" 
                         onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full flex flex-col items-center justify-center bg-gradient-to-br ${meta.color} p-4 relative\'><span class=\'text-7xl sm:text-9xl filter drop-shadow-2xl\'>${meta.emoji}</span><span class=\'absolute bottom-4 left-4 bg-black/40 backdrop-blur px-3 py-1 rounded-lg text-sm font-bold text-white/90\'>ID: ${id} (${id}.png)</span></div>';" 
                         class="w-full h-full object-contain filter drop-shadow-xl">
                </div>
            `;

            return `
                <div class="w-full h-[300px] sm:h-[420px] flex-shrink-0 flex items-center justify-center p-2">
                    <div class="w-full h-full rounded-2xl overflow-hidden bg-slate-950 flex items-center justify-center border border-slate-800">
                        ${contentHTML}
                    </div>
                </div>
            `;
        }

        function createInitialWelcomeCard() {
            return `
                <div class="w-full h-[300px] sm:h-[420px] flex-shrink-0 flex items-center justify-center p-2">
                    <div class="w-full h-full rounded-2xl overflow-hidden bg-gradient-to-br from-amber-500/20 via-slate-950 to-orange-500/20 flex items-center justify-center border-2 border-amber-500/40 shadow-inner">
                        <span class="text-4xl sm:text-7xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-orange-400 filter drop-shadow-[0_10px_20px_rgba(245,158,11,0.3)]">
                            叫我第一名
                        </span>
                    </div>
                </div>
            `;
        }

        function renderInitialCard() {
            const strip = document.getElementById('reel-strip');
            if (strip) {
                strip.innerHTML = createInitialWelcomeCard();
                strip.style.transform = 'translateY(0px)';
            }
        }

        function drawNextFruit() {
            if (pool.length === 0) {
                currentRound++;
                initPool();
            }
            return pool.pop();
        }

        function updateUIState() {
            document.getElementById('round-count').innerText = `第 ${currentRound} 輪`;
            document.getElementById('remaining-count').innerText = `${pool.length} / 17`;
            document.getElementById('history-counter').innerText = `${roundHistory.length} / 17`;
        }

        function addHistoryItem(id) {
            roundHistory.push(id);
            updateUIState();

            const container = document.getElementById('history-container');
            const emptyMsg = document.getElementById('history-empty');
            if (emptyMsg) emptyMsg.remove();

            const meta = FRUIT_METADATA[id] || { emoji: '🍎' };
            const imgSrc = customImages[id] || `${id}.png`;

            const itemEl = document.createElement('div');
            itemEl.className = 'flex-shrink-0 w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center shadow-md overflow-hidden animate-bounce';
            
            itemEl.innerHTML = `<img src="${imgSrc}" alt="${id}.png" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'text-lg\'>${meta.emoji}</span>';" class="w-8 h-8 object-contain">`;

            container.appendChild(itemEl);
            container.scrollLeft = container.scrollWidth;
        }

        // Execute spin sequence
        function spin() {
            if (isSpinning) return;
            initAudio();

            isSpinning = true;
            const nextId = drawNextFruit();
            const cardHeight = window.innerWidth >= 640 ? 420 : 300;
            const dummyCount = 15;
            const targetY = -(dummyCount * cardHeight);

            const strip = document.getElementById('reel-strip');
            let stripHTML = '';
            
            for (let i = 0; i < dummyCount; i++) {
                const randomId = ALL_FRUITS[Math.floor(Math.random() * ALL_FRUITS.length)];
                stripHTML += createCardElement(randomId);
            }
            stripHTML += createCardElement(nextId);

            strip.innerHTML = stripHTML;
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            strip.offsetHeight; // Force reflow

            let tickInterval = setInterval(() => {
                playTone(300 + Math.random() * 200, 0.05, 'triangle');
            }, 90);

            strip.style.transition = 'transform 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.0)';
            strip.style.transform = `translateY(${targetY}px)`;

            setTimeout(() => {
                clearInterval(tickInterval);
                playTone(523.25, 0.1, 'sine');
                setTimeout(() => playTone(659.25, 0.25, 'sine'), 100);

                isSpinning = false;
                addHistoryItem(nextId);
            }, 2200);
        }

        window.spin = spin;

        // Custom image upload parsing (matches 64..80 in file names)
        document.getElementById('image-uploader').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files.length) return;

            Array.from(files).forEach(file => {
                const match = file.name.match(/(6[4-9]|7[0-9]|80)/);
                if (match) {
                    const id = parseInt(match[0], 10);
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        customImages[id] = evt.target.result;
                        renderInitialCard();
                    };
                    reader.readAsDataURL(file);
                }
            });
        });

        // Click anywhere to spin
        window.addEventListener('DOMContentLoaded', () => {
            initPool();
            document.getElementById('click-area').addEventListener('click', spin);
        });
    </script>
</body>
</html>
