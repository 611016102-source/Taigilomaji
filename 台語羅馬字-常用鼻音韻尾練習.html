<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>【台語羅馬字-常用鼻音韻尾練習】</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Iansui (芫荽) -->
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Iansui', '"芫荽"', 'cursive', 'sans-serif'],
                    },
                    animation: {
                        'pop-in': 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'bounce-subtle': 'bounceSubtle 2s infinite',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.5) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Iansui', '芫荽', cursive, sans-serif !important;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Pink Polka Dot Background Theme */
        body {
            background-color: #fff1f2; /* Rose 50 */
            background-image: radial-gradient(#fb7185 2px, transparent 2px); /* Rose 400 dot grid */
            background-size: 22px 22px;
        }

        .cute-card-shadow {
            box-shadow: 0 4px 0px 0px rgba(251, 113, 133, 0.35), 0 6px 10px -2px rgba(0, 0, 0, 0.05);
        }
        
        .cute-focus-shadow {
            box-shadow: 0 12px 0px 0px rgba(251, 113, 133, 0.5), 0 16px 25px -5px rgba(0, 0, 0, 0.12);
        }

        .card-box {
            container-type: inline-size;
        }

        /* Responsive typography clamps ensuring text stays contained inside card bounds */
        .card-text-dynamic {
            font-size: clamp(1.2rem, 18cqw, 4.5rem);
            line-height: 1.1;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .modal-text-dynamic {
            font-size: clamp(3rem, 20vw, 9.5rem);
            line-height: 1.1;
            word-break: break-word;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="text-slate-800 h-[100dvh] w-screen flex flex-col justify-between select-none overflow-hidden cursor-pointer p-0 m-0">

    <header class="bg-white/95 backdrop-blur-md border-b-2 border-rose-200 sticky top-0 z-30 px-3 py-1.5 sm:py-2 shadow-sm shrink-0">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            
            <!-- Title -->
            <div class="flex items-center space-x-2 min-w-0">
                <div class="bg-rose-500 text-white font-black px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-xl shadow-sm text-xs sm:text-base animate-bounce-subtle shrink-0">
                    <i class="fa-solid fa-volume-high"></i>
                </div>
                <h1 class="text-base sm:text-xl md:text-2xl font-black tracking-wide text-rose-800 drop-shadow-sm truncate">
                    【台語羅馬字-常用鼻音韻尾練習】
                </h1>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <!-- Reset Progress -->
                <button id="resetDrawsBtn" class="p-1.5 sm:p-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border-2 border-rose-300 transition active:scale-95" title="重置進度">
                    <i class="fa-solid fa-rotate-right text-xs sm:text-base"></i>
                </button>

                <!-- Edit Cards -->
                <button id="openEditBtn" class="p-1.5 sm:p-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 border-2 border-rose-300 transition active:scale-95" title="編輯字卡">
                    <i class="fa-solid fa-pen-to-square text-xs sm:text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-2 sm:px-4 py-1.5 sm:py-2 flex-1 flex flex-col justify-between overflow-hidden gap-1.5 sm:gap-2 min-h-0">
        
        <!-- Progress Indicator -->
        <div class="flex items-center justify-between text-xs sm:text-sm font-black text-slate-600 bg-white/90 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl border-2 border-rose-300 shadow-sm max-w-xs sm:max-w-sm mx-auto w-full shrink-0">
            <span>複習進度</span>
            <div class="flex items-center space-x-2">
                <div class="w-20 sm:w-36 bg-rose-100 h-2 sm:h-2.5 rounded-full overflow-hidden border border-rose-300">
                    <div id="progressBar" class="bg-gradient-to-r from-rose-400 to-pink-500 h-full transition-all duration-300 w-0"></div>
                </div>
                <span class="text-rose-800 font-black"><span id="drawnCardsCount">0</span> / <span id="totalCardsCount">12</span></span>
            </div>
        </div>

        <!-- Dynamic Card Rows Container (3 Rows) -->
        <div id="rowsContainer" class="flex-1 flex flex-col justify-center gap-1.5 sm:gap-2.5 max-w-6xl mx-auto w-full min-h-0 py-0.5">
            <!-- Rendered by JS -->
        </div>

    </main>

    <div id="focusModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col items-center justify-between p-3 sm:p-6 hidden opacity-0 transition-opacity duration-300">
        
        <!-- Modal Top Control Bar -->
        <div class="w-full max-w-3xl flex items-center justify-between z-10 shrink-0">
            <div class="px-3 sm:px-4 py-1 sm:py-1.5 bg-white/95 rounded-full border-2 border-rose-300 flex items-center gap-2 text-slate-700 text-xs sm:text-sm font-black shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-400 animate-ping"></span>
                <span id="modalProgressText">1 / 12</span>
            </div>

            <button id="closeFocusModalBtn" class="p-2 text-slate-500 hover:text-slate-800 bg-white hover:bg-slate-100 rounded-full transition border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-xmark text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Enlarged Card Area -->
        <div id="cardStage" class="flex-1 w-full max-w-2xl my-auto flex items-center justify-center cursor-pointer p-2 min-h-0">
            <div id="focusCard" class="w-full max-h-[75vh] bg-white rounded-3xl border-4 sm:border-8 border-rose-400 cute-focus-shadow p-4 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300 hover:scale-[1.01]">
                
                <!-- Radial Glow Effects -->
                <div class="absolute -top-16 -right-16 w-40 sm:w-52 h-40 sm:h-52 bg-rose-200/60 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-16 -left-16 w-40 sm:w-52 h-40 sm:h-52 bg-pink-200/60 rounded-full blur-2xl pointer-events-none"></div>

                <!-- Magnified Card Symbol Text -->
                <div class="my-auto flex items-center justify-center w-full px-2 text-center max-w-full">
                    <h2 id="modalConsonant" class="modal-text-dynamic font-black tracking-wide text-rose-700 drop-shadow-md select-none w-full text-center">
                        m
                    </h2>
                </div>

            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border-4 border-rose-300 rounded-3xl max-w-md w-full p-4 sm:p-5 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between pb-2 sm:pb-3 border-b-2 border-rose-100 mb-2 sm:mb-3">
                <h3 class="text-sm sm:text-lg font-black text-rose-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i>
                    編輯鼻音韻尾字卡
                </h3>
                <button id="closeEditModalBtn" class="text-slate-400 hover:text-slate-700">
                    <i class="fa-solid fa-xmark text-lg sm:text-xl"></i>
                </button>
            </div>

            <p class="text-xs sm:text-sm text-slate-500 mb-2">
                用換行隔開每一列，用逗號隔開鼻音韻尾字母。
            </p>

            <textarea id="editCardsTextarea" class="w-full h-36 sm:h-44 bg-rose-50/50 border-2 border-rose-300 rounded-2xl p-2.5 sm:p-3 text-xs sm:text-sm text-slate-800 font-mono focus:outline-none focus:border-rose-400 resize-none mb-3" placeholder="m, am, im, iam&#10;an, in, un, ian&#10;ng, ang, ong, eng"></textarea>

            <div class="flex justify-between items-center">
                <button id="restoreDefaultCardsBtn" class="text-xs sm:text-sm text-slate-400 hover:text-rose-700 underline font-bold">
                    恢復預設卡片
                </button>
                <div class="flex space-x-2">
                    <button id="cancelEditBtn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 text-xs sm:text-sm font-bold">
                        取消
                    </button>
                    <button id="saveEditBtn" class="px-3.5 py-1.5 bg-rose-500 hover:bg-rose-400 text-white rounded-xl text-xs sm:text-sm font-black shadow-sm">
                        儲存套用
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Taiwanese Romanization Nasal Codas (3 Rows) ---
        const DEFAULT_ROW_GROUPS = [
            ['m', 'am', 'im', 'iam'],
            ['an', 'in', 'un', 'ian'],
            ['ng', 'ang', 'ong', 'eng']
        ];

        let ROW_GROUPS = JSON.parse(JSON.stringify(DEFAULT_ROW_GROUPS));

        // 3 Distinct Color Themes for Pink Palette
        const REGION_THEMES = [
            { bg: 'bg-rose-50 hover:bg-rose-100', border: 'border-rose-400', text: 'text-rose-700' },
            { bg: 'bg-purple-50 hover:bg-purple-100', border: 'border-purple-400', text: 'text-purple-700' },
            { bg: 'bg-amber-50 hover:bg-amber-100', border: 'border-amber-400', text: 'text-amber-700' }
        ];

        function getRegionTheme(rowIndex) {
            return REGION_THEMES[rowIndex % REGION_THEMES.length];
        }

        // --- Application State ---
        let allConsonants = [];
        let drawnIndices = new Set();
        let currentIndex = -1;
        let isFocusMode = false;

        // Audio Context for feedback chime
        let audioCtx = null;

        // --- DOM Elements ---
        const rowsContainer = document.getElementById('rowsContainer');
        const drawnCardsCount = document.getElementById('drawnCardsCount');
        const totalCardsCount = document.getElementById('totalCardsCount');
        const progressBar = document.getElementById('progressBar');

        const focusModal = document.getElementById('focusModal');
        const focusCard = document.getElementById('focusCard');
        const modalConsonant = document.getElementById('modalConsonant');
        const modalProgressText = document.getElementById('modalProgressText');
        const closeFocusModalBtn = document.getElementById('closeFocusModalBtn');

        const resetDrawsBtn = document.getElementById('resetDrawsBtn');

        const openEditBtn = document.getElementById('openEditBtn');
        const editModal = document.getElementById('editModal');
        const closeEditModalBtn = document.getElementById('closeEditModalBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const editCardsTextarea = document.getElementById('editCardsTextarea');
        const restoreDefaultCardsBtn = document.getElementById('restoreDefaultCardsBtn');

        function init() {
            flattenConsonants();
            renderRows();
            setupEventListeners();
        }

        function flattenConsonants() {
            allConsonants = [];
            ROW_GROUPS.forEach(group => {
                group.forEach(symbol => allConsonants.push(symbol));
            });
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playChime(freq = 659.25, duration = 0.15) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error(e);
            }
        }

        function formatSymbolText(symbol) {
            return symbol.replace(/\n/g, '<br>');
        }

        function renderRows() {
            rowsContainer.innerHTML = '';

            totalCardsCount.textContent = allConsonants.length;
            drawnCardsCount.textContent = drawnIndices.size;
            const pct = allConsonants.length > 0 ? (drawnIndices.size / allConsonants.length) * 100 : 0;
            progressBar.style.width = `${pct}%`;

            let flatIdx = 0;

            ROW_GROUPS.forEach((group, rowIndex) => {
                const regionTheme = getRegionTheme(rowIndex);
                
                const rowEl = document.createElement('div');
                rowEl.className = `p-1.5 sm:p-2.5 rounded-2xl bg-white/85 border-2 border-rose-300 shadow-sm flex flex-1 items-center justify-center gap-1.5 sm:gap-2.5 w-full h-[22vh] max-h-[160px] min-h-0 overflow-hidden`;

                group.forEach(symbol => {
                    const currentIndexVal = flatIdx;
                    const isDrawn = drawnIndices.has(currentIndexVal);

                    let cardBg = regionTheme.bg;
                    let cardBorder = regionTheme.border;
                    let textColor = isDrawn ? 'text-slate-400' : regionTheme.text;

                    const cardEl = document.createElement('div');
                    cardEl.className = `card-box relative rounded-xl sm:rounded-2xl p-1 sm:p-2 border-2 sm:border-3 transition-all duration-200 flex-1 min-w-0 h-full flex items-center justify-center cute-card-shadow overflow-hidden ${
                        isDrawn 
                        ? 'bg-slate-100 border-slate-200 opacity-35 scale-95' 
                        : `${cardBg} ${cardBorder}`
                    }`;

                    cardEl.onclick = (e) => {
                        e.stopPropagation();
                        openCardAtIndex(currentIndexVal);
                    };

                    const formattedSymbol = formatSymbolText(symbol);

                    cardEl.innerHTML = `
                        ${isDrawn ? '<div class="absolute top-1 right-1.5 sm:top-2 sm:right-2 text-rose-600 text-xs sm:text-base"><i class="fa-solid fa-check font-black"></i></div>' : ''}
                        <div class="card-text-dynamic font-black ${textColor} tracking-tight select-none drop-shadow-sm flex items-center justify-center text-center w-full px-0.5 leading-none">
                            ${formattedSymbol}
                        </div>
                    `;

                    rowEl.appendChild(cardEl);
                    flatIdx++;
                });

                rowsContainer.appendChild(rowEl);
            });
        }

        function drawNextRandomCard() {
            const undrawn = [];
            allConsonants.forEach((_, idx) => {
                if (!drawnIndices.has(idx)) undrawn.push(idx);
            });

            if (undrawn.length === 0) {
                showToast('🎉 所有鼻音韻尾已複習完畢！自動重置');
                drawnIndices.clear();
                allConsonants.forEach((_, idx) => undrawn.push(idx));
            }

            const randomIndex = undrawn[Math.floor(Math.random() * undrawn.length)];
            openCardAtIndex(randomIndex);
        }

        function openCardAtIndex(index) {
            if (index < 0 || index >= allConsonants.length) return;

            currentIndex = index;
            drawnIndices.add(index);
            renderRows();

            const symbol = allConsonants[index];

            let targetRow = 0;
            let tempCount = 0;
            for (let r = 0; r < ROW_GROUPS.length; r++) {
                tempCount += ROW_GROUPS[r].length;
                if (index < tempCount) {
                    targetRow = r;
                    break;
                }
            }
            const regionTheme = getRegionTheme(targetRow);

            const formattedModalSymbol = formatSymbolText(symbol);

            modalConsonant.innerHTML = formattedModalSymbol;
            modalConsonant.className = `modal-text-dynamic font-black tracking-wide ${regionTheme.text} drop-shadow-md select-none flex items-center justify-center text-center w-full leading-none`;
            focusCard.className = `w-full max-h-[75vh] bg-white rounded-3xl border-4 sm:border-8 ${regionTheme.border} cute-focus-shadow p-4 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300 hover:scale-[1.01]`;
            modalProgressText.textContent = `${drawnIndices.size} / ${allConsonants.length}`;

            if (!isFocusMode) {
                isFocusMode = true;
                focusModal.classList.remove('hidden');
                setTimeout(() => {
                    focusModal.classList.remove('opacity-0');
                }, 10);
            }

            focusCard.classList.remove('animate-pop-in');
            void focusCard.offsetWidth;
            focusCard.classList.add('animate-pop-in');

            playChime(659.25, 0.15);
        }

        function closeFocusModal() {
            isFocusMode = false;
            focusModal.classList.add('opacity-0');
            setTimeout(() => {
                focusModal.classList.add('hidden');
            }, 300);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-rose-500 text-white border-2 border-rose-300 px-4 py-2 rounded-2xl shadow-xl z-50 font-black text-xs sm:text-base flex items-center space-x-2 animate-bounce';
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2400);
        }

        function openEditModal() {
            editCardsTextarea.value = ROW_GROUPS.map(g => g.join(', ')).join('\n');
            editModal.classList.remove('hidden');
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
        }

        function saveEditedCards() {
            const lines = editCardsTextarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const newGroups = [];

            lines.forEach(line => {
                const items = line.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (items.length > 0) {
                    newGroups.push(items);
                }
            });

            if (newGroups.length === 0) {
                showToast('❌ 請至少輸入一組有效的鼻音韻尾！');
                return;
            }

            ROW_GROUPS.length = 0;
            newGroups.forEach(g => ROW_GROUPS.push(g));

            flattenConsonants();
            drawnIndices.clear();
            closeEditModal();
            renderRows();
            showToast('✅ 已成功變更鼻音韻尾內容！');
        }

        function setupEventListeners() {
            closeFocusModalBtn.onclick = (e) => {
                e.stopPropagation();
                closeFocusModal();
            };

            resetDrawsBtn.onclick = (e) => {
                e.stopPropagation();
                drawnIndices.clear();
                renderRows();
                showToast('已重置所有練習紀錄');
            };

            openEditBtn.onclick = (e) => {
                e.stopPropagation();
                openEditModal();
            };
            closeEditModalBtn.onclick = closeEditModal;
            cancelEditBtn.onclick = closeEditModal;
            saveEditBtn.onclick = saveEditedCards;

            restoreDefaultCardsBtn.onclick = () => {
                ROW_GROUPS.length = 0;
                JSON.parse(JSON.stringify(DEFAULT_ROW_GROUPS)).forEach(g => ROW_GROUPS.push(g));
                
                flattenConsonants();
                drawnIndices.clear();
                openEditModal();
                showToast('已恢復預設鼻音韻尾');
            };

            // Global Left-Click listener anywhere on the screen
            document.addEventListener('click', (e) => {
                if (!editModal.classList.contains('hidden')) return;

                if (e.target.closest('#resetDrawsBtn') || 
                    e.target.closest('#openEditBtn') || 
                    e.target.closest('#closeFocusModalBtn')) {
                    return;
                }

                drawNextRandomCard();
            });

            // Global Right-Click listener anywhere on the screen
            document.addEventListener('contextmenu', (e) => {
                if (!editModal.classList.contains('hidden')) return;
                if (editModal.contains(e.target)) return;

                e.preventDefault();
                drawNextRandomCard();
            });

            // Keyboard / Presenter Clicker listener
            document.addEventListener('keydown', (e) => {
                if (!editModal.classList.contains('hidden')) return;

                switch (e.code) {
                    case 'Space':
                    case 'PageDown':
                    case 'PageUp':
                    case 'ArrowRight':
                    case 'ArrowDown':
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        e.preventDefault();
                        drawNextRandomCard();
                        break;
                    case 'Escape':
                        if (isFocusMode) closeFocusModal();
                        if (!editModal.classList.contains('hidden')) closeEditModal();
                        break;
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
