<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>【果子篇-照片版】</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Iansui (芫荽) -->
    <link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Iansui', '"芫荽"', 'cursive', 'sans-serif'],
                    },
                    animation: {
                        'pop-in': 'popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        'bounce-subtle': 'bounceSubtle 2s infinite',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.5) translateY(20px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        bounceSubtle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-4px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Iansui', '芫荽', cursive, sans-serif !important;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Yellow Polka Dot Background Theme */
        body {
            background-color: #fefce8; /* Yellow 50 */
            background-image: radial-gradient(#eab308 2px, transparent 2px); /* Amber 500 dot grid */
            background-size: 22px 22px;
        }

        .cute-card-shadow {
            box-shadow: 0 4px 0px 0px rgba(234, 179, 8, 0.3), 0 6px 10px -2px rgba(0, 0, 0, 0.05);
        }
        
        .cute-focus-shadow {
            box-shadow: 0 12px 0px 0px rgba(234, 179, 8, 0.4), 0 16px 25px -5px rgba(0, 0, 0, 0.12);
        }

        .card-box {
            container-type: inline-size;
        }
    </style>
</head>
<body class="text-slate-800 h-[100dvh] w-screen flex flex-col justify-between select-none overflow-hidden cursor-pointer p-0 m-0">

    <header class="bg-white/95 backdrop-blur-md border-b-2 border-amber-300 sticky top-0 z-30 px-3 py-1.5 sm:py-2 shadow-sm shrink-0">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            
            <!-- Title -->
            <div class="flex items-center space-x-2 min-w-0">
                <div class="bg-amber-500 text-white font-black px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-xl shadow-sm text-xs sm:text-base animate-bounce-subtle shrink-0">
                    <i class="fa-solid fa-apple-whole"></i>
                </div>
                <h1 class="text-base sm:text-xl md:text-2xl font-black tracking-wide text-amber-950 drop-shadow-sm truncate">
                    【果子篇-照片版】
                </h1>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                <!-- Reset Progress -->
                <button id="resetDrawsBtn" class="p-1.5 sm:p-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-900 border-2 border-amber-300 transition active:scale-95" title="重置進度">
                    <i class="fa-solid fa-rotate-right text-xs sm:text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-2 sm:px-4 py-1.5 sm:py-2 flex-1 flex flex-col justify-between overflow-hidden gap-1.5 sm:gap-2 min-h-0">
        
        <!-- Progress Indicator -->
        <div class="flex items-center justify-between text-xs sm:text-sm font-black text-slate-600 bg-white/90 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl border-2 border-amber-300 shadow-sm max-w-xs sm:max-w-sm mx-auto w-full shrink-0">
            <span>複習進度</span>
            <div class="flex items-center space-x-2">
                <div class="w-20 sm:w-36 bg-amber-100 h-2 sm:h-2.5 rounded-full overflow-hidden border border-amber-300">
                    <div id="progressBar" class="bg-gradient-to-r from-amber-400 to-yellow-500 h-full transition-all duration-300 w-0"></div>
                </div>
                <span class="text-amber-950 font-black"><span id="drawnCardsCount">0</span> / <span id="totalCardsCount">18</span></span>
            </div>
        </div>

        <!-- Dynamic Card Rows Container -->
        <div id="rowsContainer" class="flex-1 flex flex-col justify-center gap-2 sm:gap-2.5 max-w-6xl mx-auto w-full min-h-0 py-0.5">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- Enlarged Card Focus Modal -->
    <div id="focusModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex flex-col items-center justify-between p-3 sm:p-6 hidden opacity-0 transition-opacity duration-300">
        
        <!-- Modal Top Control Bar -->
        <div class="w-full max-w-3xl flex items-center justify-between z-10 shrink-0">
            <div class="px-3 sm:px-4 py-1 sm:py-1.5 bg-white/95 rounded-full border-2 border-amber-300 flex items-center gap-2 text-slate-700 text-xs sm:text-sm font-black shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                <span id="modalProgressText">1 / 18</span>
            </div>

            <button id="closeFocusModalBtn" class="p-2 text-slate-500 hover:text-slate-800 bg-white hover:bg-slate-100 rounded-full transition border-2 border-slate-200 shadow-sm">
                <i class="fa-solid fa-xmark text-lg sm:text-xl w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center"></i>
            </button>
        </div>

        <!-- Enlarged Card Area -->
        <div id="cardStage" class="flex-1 w-full max-w-2xl my-auto flex items-center justify-center cursor-pointer p-2 min-h-0">
            <div id="focusCard" class="w-full h-[65vh] max-h-[500px] bg-white rounded-3xl border-4 sm:border-8 border-amber-400 cute-focus-shadow p-3 sm:p-6 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300 hover:scale-[1.01]">
                
                <!-- Radial Glow Effects -->
                <div class="absolute -top-16 -right-16 w-40 sm:w-52 h-40 sm:h-52 bg-amber-200/60 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-16 -left-16 w-40 sm:w-52 h-40 sm:h-52 bg-yellow-200/60 rounded-full blur-2xl pointer-events-none"></div>

                <!-- Magnified Fruit Image -->
                <div class="my-auto flex items-center justify-center w-full h-full p-2 relative z-10">
                    <img id="modalFruitImg" src="" alt="果子照片" class="w-full h-full object-contain rounded-2xl drop-shadow-md select-none" />
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 18 Fruit Image Items arranged into 3 rows ---
        // Image filenames are mapped to 64.jpg ~ 80.jpg (local files)
        const DEFAULT_ROW_GROUPS = [
            [
                { name: '蘋果', img: '64.jpg', backupImg: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500&auto=format&fit=crop' },
                { name: '鳳梨', img: '65.jpg', backupImg: 'https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=500&auto=format&fit=crop' },
                { name: '櫻桃', img: '66.jpg', backupImg: 'https://images.unsplash.com/photo-1528825871115-3581a5387919?w=500&auto=format&fit=crop' },
                { name: '橘子', img: '67.jpg', backupImg: 'https://images.unsplash.com/photo-1547514701-42782101795e?w=500&auto=format&fit=crop' },
                { name: '木瓜', img: '68.jpg', backupImg: 'https://images.unsplash.com/photo-1517260739337-6799d239ce83?w=500&auto=format&fit=crop' },
                { name: '芭樂', img: '69.jpg', backupImg: 'https://images.unsplash.com/photo-1536511135882-70b74100e00d?w=500&auto=format&fit=crop' }
            ],
            [
                { name: '酪梨', img: '70.jpg', backupImg: 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=500&auto=format&fit=crop' },
                { name: '龍眼', img: '71.jpg', backupImg: 'https://images.unsplash.com/photo-1627916607164-7b20241db935?w=500&auto=format&fit=crop' },
                { name: '荔枝', img: '72.jpg', backupImg: 'https://images.unsplash.com/photo-1594951466034-73c249a0e698?w=500&auto=format&fit=crop' },
                { name: '芒果', img: '73.jpg', backupImg: 'https://images.unsplash.com/photo-1553279768-865429fa0078?w=500&auto=format&fit=crop' },
                { name: '枇杷', img: '74.jpg', backupImg: 'https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=500&auto=format&fit=crop' },
                { name: '葡萄', img: '75.jpg', backupImg: 'https://images.unsplash.com/photo-1537640538966-79f369143f8f?w=500&auto=format&fit=crop' }
            ],
            [
                { name: '西瓜', img: '76.jpg', backupImg: 'https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=500&auto=format&fit=crop' },
                { name: '香蕉', img: '77.jpg', backupImg: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=500&auto=format&fit=crop' },
                { name: '百香果', img: '78.jpg', backupImg: 'https://images.unsplash.com/photo-1596706939527-df174a819b1c?w=500&auto=format&fit=crop' },
                { name: '奇異果', img: '79.jpg', backupImg: 'https://images.unsplash.com/photo-1585059819970-07f912127925?w=500&auto=format&fit=crop' },
                { name: '火龍果', img: '80.jpg', backupImg: 'https://images.unsplash.com/photo-1527325678964-549216468488?w=500&auto=format&fit=crop' },
                { name: '香蕉', img: '77.jpg', backupImg: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=500&auto=format&fit=crop' }
            ]
        ];

        let ROW_GROUPS = JSON.parse(JSON.stringify(DEFAULT_ROW_GROUPS));

        // 3 Distinct Colors for the 3 Rows:
        const REGION_THEMES = [
            { bg: 'bg-amber-50 hover:bg-amber-100', border: 'border-amber-400' },
            { bg: 'bg-emerald-50 hover:bg-emerald-100', border: 'border-emerald-400' },
            { bg: 'bg-rose-50 hover:bg-rose-100', border: 'border-rose-400' }
        ];

        function getRegionTheme(rowIndex) {
            return REGION_THEMES[rowIndex % REGION_THEMES.length];
        }

        // --- Application State ---
        let allConsonants = [];
        let drawnIndices = new Set();
        let currentIndex = -1;
        let isFocusMode = false;

        // Audio Context for chime
        let audioCtx = null;

        // --- DOM Elements ---
        const rowsContainer = document.getElementById('rowsContainer');
        const drawnCardsCount = document.getElementById('drawnCardsCount');
        const totalCardsCount = document.getElementById('totalCardsCount');
        const progressBar = document.getElementById('progressBar');

        const focusModal = document.getElementById('focusModal');
        const focusCard = document.getElementById('focusCard');
        const modalFruitImg = document.getElementById('modalFruitImg');
        const modalProgressText = document.getElementById('modalProgressText');
        const closeFocusModalBtn = document.getElementById('closeFocusModalBtn');
        const resetDrawsBtn = document.getElementById('resetDrawsBtn');

        function init() {
            flattenConsonants();
            renderRows();
            setupEventListeners();
        }

        function flattenConsonants() {
            allConsonants = [];
            ROW_GROUPS.forEach(group => {
                group.forEach(item => allConsonants.push(item));
            });
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playChime(freq = 659.25, duration = 0.15) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.error(e);
            }
        }

        function renderRows() {
            rowsContainer.innerHTML = '';

            totalCardsCount.textContent = allConsonants.length;
            drawnCardsCount.textContent = drawnIndices.size;
            const pct = allConsonants.length > 0 ? (drawnIndices.size / allConsonants.length) * 100 : 0;
            progressBar.style.width = `${pct}%`;

            let flatIdx = 0;

            ROW_GROUPS.forEach((group, rowIndex) => {
                const regionTheme = getRegionTheme(rowIndex);
                
                const rowEl = document.createElement('div');
                rowEl.className = `p-1.5 sm:p-2 rounded-2xl bg-white/85 border-2 ${regionTheme.border} shadow-sm flex flex-1 items-center justify-center gap-1.5 sm:gap-2.5 w-full h-[25vh] max-h-[180px] min-h-0 overflow-hidden`;

                group.forEach(item => {
                    const currentIndexVal = flatIdx;
                    const isDrawn = drawnIndices.has(currentIndexVal);

                    let cardBg = regionTheme.bg;
                    let cardBorder = regionTheme.border;

                    const cardEl = document.createElement('div');
                    cardEl.className = `card-box relative rounded-xl sm:rounded-2xl p-1 sm:p-1.5 border-2 sm:border-3 transition-all duration-200 flex-1 min-w-0 h-full flex items-center justify-center cute-card-shadow overflow-hidden ${
                        isDrawn 
                        ? 'bg-slate-100 border-slate-200 opacity-35 scale-95' 
                        : `${cardBg} ${cardBorder}`
                    }`;

                    cardEl.onclick = (e) => {
                        e.stopPropagation();
                        openCardAtIndex(currentIndexVal);
                    };

                    const fallbackImg = `https://placehold.co/300x300/eab308/ffffff?text=${encodeURIComponent(item.name)}`;

                    cardEl.innerHTML = `
                        ${isDrawn ? '<div class="absolute top-1 right-1.5 sm:top-2 sm:right-2 text-amber-600 text-xs sm:text-base z-20 bg-white/90 rounded-full w-5 h-5 flex items-center justify-center shadow-sm"><i class="fa-solid fa-check font-black"></i></div>' : ''}
                        <div class="w-full h-full flex items-center justify-center p-0.5 relative z-10 overflow-hidden">
                            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover rounded-lg sm:rounded-xl shadow-inner select-none pointer-events-none" onerror="this.onerror=null;this.src='${item.backupImg}';" />
                        </div>
                    `;

                    rowEl.appendChild(cardEl);
                    flatIdx++;
                });

                rowsContainer.appendChild(rowEl);
            });
        }

        function drawNextRandomCard() {
            const undrawn = [];
            allConsonants.forEach((_, idx) => {
                if (!drawnIndices.has(idx)) undrawn.push(idx);
            });

            if (undrawn.length === 0) {
                showToast('🎉 所有果子照片卡已複習完畢！自動重置');
                drawnIndices.clear();
                allConsonants.forEach((_, idx) => undrawn.push(idx));
            }

            const randomIndex = undrawn[Math.floor(Math.random() * undrawn.length)];
            openCardAtIndex(randomIndex);
        }

        function openCardAtIndex(index) {
            if (index < 0 || index >= allConsonants.length) return;

            currentIndex = index;
            drawnIndices.add(index);
            renderRows();

            const item = allConsonants[index];

            let targetRow = 0;
            let tempCount = 0;
            for (let r = 0; r < ROW_GROUPS.length; r++) {
                tempCount += ROW_GROUPS[r].length;
                if (index < tempCount) {
                    targetRow = r;
                    break;
                }
            }
            const regionTheme = getRegionTheme(targetRow);

            modalFruitImg.src = item.img;
            modalFruitImg.alt = item.name;
            modalFruitImg.onerror = function() {
                this.onerror = null;
                this.src = item.backupImg;
            };

            focusCard.className = `w-full h-[65vh] max-h-[500px] bg-white rounded-3xl border-4 sm:border-8 ${regionTheme.border} cute-focus-shadow p-3 sm:p-6 flex flex-col items-center justify-center relative overflow-hidden transform transition-all duration-300 hover:scale-[1.01]`;
            modalProgressText.textContent = `${drawnIndices.size} / ${allConsonants.length}`;

            if (!isFocusMode) {
                isFocusMode = true;
                focusModal.classList.remove('hidden');
                setTimeout(() => {
                    focusModal.classList.remove('opacity-0');
                }, 10);
            }

            focusCard.classList.remove('animate-pop-in');
            void focusCard.offsetWidth;
            focusCard.classList.add('animate-pop-in');

            playChime(659.25, 0.15);
        }

        function closeFocusModal() {
            isFocusMode = false;
            focusModal.classList.add('opacity-0');
            setTimeout(() => {
                focusModal.classList.add('hidden');
            }, 300);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-white border-2 border-amber-300 px-4 py-2 rounded-2xl shadow-xl z-50 font-black text-xs sm:text-base flex items-center space-x-2 animate-bounce';
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2400);
        }

        function setupEventListeners() {
            closeFocusModalBtn.onclick = (e) => {
                e.stopPropagation();
                closeFocusModal();
            };

            resetDrawsBtn.onclick = (e) => {
                e.stopPropagation();
                drawnIndices.clear();
                renderRows();
                showToast('已重置所有練習紀錄');
            };

            // Global Left-Click listener anywhere on the screen
            document.addEventListener('click', (e) => {
                if (e.target.closest('#resetDrawsBtn') || 
                    e.target.closest('#closeFocusModalBtn')) {
                    return;
                }

                drawNextRandomCard();
            });

            // Global Right-Click listener anywhere on the screen
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                drawNextRandomCard();
            });

            // Keyboard / Presenter Clicker listener
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'Space':
                    case 'PageDown':
                    case 'PageUp':
                    case 'ArrowRight':
                    case 'ArrowDown':
                    case 'ArrowLeft':
                    case 'ArrowUp':
                        e.preventDefault();
                        drawNextRandomCard();
                        break;
                    case 'Escape':
                        if (isFocusMode) closeFocusModal();
                        break;
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
