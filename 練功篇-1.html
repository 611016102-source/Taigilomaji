<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" rel="stylesheet">
<title>練功篇｜台灣風格隨機練習</title>
<style>
:root{--ink:#18334a;--teal:#126e70;--red:#b94c3b;--cream:#fff9ed;--gold:#e6b95c;--muted:#61727b;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Iansui","芫荽",system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--cream);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#d8eee9 0%,#fff8e8 52%,#f3dfc4 100%)}
body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:145px;z-index:-1;background:linear-gradient(150deg,transparent 0 12%,#4c7771 12.2% 22%,transparent 22.2%),linear-gradient(25deg,transparent 0 34%,#2e625f 34.2% 48%,transparent 48.2%),linear-gradient(160deg,transparent 0 42%,#8a9b79 42.2% 58%,transparent 58.2%),linear-gradient(0deg,#b65d48 0 15px,#d8a15d 15px 22px,#b65d48 22px 28px,transparent 28px);opacity:.72}
.topbar{background:#163e51;color:#fff8e8;padding:24px 18px 30px;border-bottom:6px solid var(--gold);position:relative;overflow:hidden}
.topbar:after{content:"";position:absolute;right:-25px;top:-45px;width:210px;height:210px;border:2px solid #e6b95c;border-radius:50%;box-shadow:0 0 0 12px #163e51,0 0 0 14px #e6b95c,0 0 0 28px #163e51,0 0 0 30px #e6b95c;opacity:.25}
.wrap{max-width:900px;margin:auto;padding:0 16px}
.brand{font-size:12px;letter-spacing:.18em;color:#f0cc7a;font-weight:800}
h1{font-size:clamp(28px,5vw,42px);margin:8px 0 6px;letter-spacing:.06em}
.subtitle{margin:0;color:#e5f1ed;font-size:15px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
select,button{font:inherit;font-family:inherit;border-radius:12px;padding:11px 14px;border:1px solid #c8d6cf;background:#fffdf7;color:var(--ink)}
select{flex:1;min-width:220px}
button{cursor:pointer;font-weight:700;transition:transform .12s,filter .12s}
button:hover{filter:brightness(.97);transform:translateY(-1px)}
.primary{background:var(--red);color:white;border-color:var(--red)}
.card{background:var(--card);border:1px solid #eadbc3;border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 12px 32px #244d3b12;margin:18px 0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700}
.question{font-size:clamp(19px,3vw,24px);line-height:1.7;margin:18px 0 20px;white-space:pre-wrap}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid #d8ded7;padding:14px 15px;border-radius:14px;line-height:1.55;font-weight:500}
.letter{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e2efea;color:#1d5d5c;font-weight:800}
.option.correct{border-color:#23836d;background:#eaf7f0}
.option.correct .letter{background:#23836d;color:white}
.option.wrong{border-color:#c56b58;background:#fff0eb}
.option.wrong .letter{background:#b94c3b;color:white}
.option:disabled{cursor:default;transform:none;filter:none}
.feedback{margin-top:18px;padding:16px;border-radius:14px;background:#f2f5ee;border-left:4px solid var(--teal);line-height:1.65}
.feedback strong{display:block;margin-bottom:5px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.small{font-size:13px;color:var(--muted);line-height:1.6}
.pill{display:inline-block;background:#f5e6c7;color:#79552c;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.footer{text-align:center;padding:20px 10px 175px;color:#526e6a;font-size:12px}
.hidden{display:none!important}
@media(max-width:560px){.controls{display:grid}.controls>*{width:100%}.nav button{flex:1}.card{border-radius:16px}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap">
<div class="brand">TAIWAN LANGUAGE PRACTICE</div>
<h1>練功篇</h1>
<p class="subtitle">沓沓仔練習・一題一題來熟似台灣話</p>
</div></header>
<main class="wrap">
<div class="controls">
<select id="sectionSelect" aria-label="選擇題目範圍"><option value="all">全部題目・隨機抽題</option></select>
<select id="countSelect" aria-label="選擇題數"><option value="10">每回 10 題</option><option value="20" selected>每回 20 題</option><option value="50">每回 50 題</option><option value="all">本範圍全部題目</option></select>
<button class="primary" id="startBtn">開始練習／重新抽題</button>
</div>
<div class="small">無計時、無壓力。點選答案後會即刻顯示正確答案。題目與答案依你提供的兩份 PDF 整理。</div>
<section class="card" id="quizCard">
<div class="meta"><span id="progress">準備開始</span><span class="pill">練習模式</span></div>
<div class="question" id="questionText">選擇題目範圍，按「開始練習」就會隨機出題。</div>
<div class="options" id="options"></div>
<div class="feedback hidden" id="feedback"></div>
<div class="nav"><button id="prevBtn" disabled>上一題</button><button class="primary" id="nextBtn" disabled>下一題</button></div>
</section>

</main>

<script>
const SECTIONS = [{"title": "第一部分:語意佮語音", "questions": [{"number": 1, "question": "請問下面佗一句「干焦」的意思，和其他的選項無仝款?", "options": [{"value": "A", "text": "超市「干焦」賰遮的菜爾爾"}, {"value": "B", "text": "「干焦」彼个客戶特別狡怪"}, {"value": "C", "text": "叫伊莫食，伊「干焦」欲"}, {"value": "D", "text": "頭家「干焦」找遮的錢予我"}], "answer": "C"}, {"number": 2, "question": "王祿仔仙講伊賣的藥仔偌爾厲害，食了，「跛跤的會行去，曲痀的會直去，粒仔會消 去，人無去」。是暗示講食伊的藥仔可能會按怎?", "options": [{"value": "A", "text": "卯死矣"}, {"value": "B", "text": "無敗害"}, {"value": "C", "text": "死翹翹"}, {"value": "D", "text": "有保庇"}], "answer": "C"}, {"number": 3, "question": "下面佗一組語詞的意思毋是顛倒反?", "options": [{"value": "A", "text": "艱苦/輕可"}, {"value": "B", "text": "骨力/荏懶(lám-nuā)"}, {"value": "C", "text": "抝蠻/剾洗(khau-sé)"}, {"value": "D", "text": "古意/陰鴆(im-thim)"}], "answer": "C"}, {"number": 4, "question": "下面佗一句話無適合用「無彩」的語詞?", "options": [{"value": "A", "text": "物件買了若無用，真「無彩」"}, {"value": "B", "text": "伊差一點仔就入選，實在真「無彩」"}, {"value": "C", "text": "伊暗時仔睏無好勢，精神真「無彩」"}, {"value": "D", "text": "「無彩」伊用心經營，猶原失敗"}], "answer": "C"}, {"number": 5, "question": "「一人一家『代』 ，公媽隨人祀(tshāi)。」其中的『代』和空格仔內佗一个「代」的意 思相仝?", "options": [{"value": "A", "text": "底「代」"}, {"value": "B", "text": "交「代」"}, {"value": "C", "text": "萬「代」"}, {"value": "D", "text": "後「代」"}], "answer": "A"}, {"number": 6, "question": "「一爿是溝，一爿是圳」，這句話的意思是講?", "options": [{"value": "A", "text": "擔輸贏"}, {"value": "B", "text": "失覺察"}, {"value": "C", "text": "袂伸捙(tshun-tshia)"}, {"value": "D", "text": "真為難 。"}], "answer": "D"}, {"number": 7, "question": "「小生佇台仔頂那唱閣那比」的「比」佮下面佗一項的「比」意思相仝?", "options": [{"value": "A", "text": "比喻"}, {"value": "B", "text": "可比"}, {"value": "C", "text": "比輸贏"}, {"value": "D", "text": "用手比人"}], "answer": "D"}, {"number": 8, "question": "「無衫會寒」這句話是講天氣啥款?", "options": [{"value": "A", "text": "天氣涼冷"}, {"value": "B", "text": "天氣燒熱"}, {"value": "C", "text": "無啥會寒"}, {"value": "D", "text": "天氣翕熱(hip-jua̍h)"}], "answer": "A"}, {"number": 9, "question": "「下面佗一个語詞中的「食」，有食物件的意思?", "options": [{"value": "A", "text": "食錢"}, {"value": "B", "text": "食力"}, {"value": "C", "text": "食人"}, {"value": "D", "text": "食奶"}], "answer": "D"}, {"number": 10, "question": "下面佗一組語詞的意思仝款?", "options": [{"value": "A", "text": "礙虐/掛礙"}, {"value": "B", "text": "飫喙(uì-tshuì)/枵饞(iau-sâi)"}, {"value": "C", "text": "慒心/慼心"}, {"value": "D", "text": "凝心/鬱卒"}], "answer": "D"}, {"number": 11, "question": "「這間海產店的海味上蓋鮮，因為攏是用『現流仔』的。這句話內底的『現流仔』 佮下面佗一个意思較合?", "options": [{"value": "A", "text": "現掠的"}, {"value": "B", "text": "現削的"}, {"value": "C", "text": "現煮的"}, {"value": "D", "text": "現煠(sa̍h)的"}], "answer": "A"}, {"number": 12, "question": "「春嬌和志明頭一擺相親，互相見面的時，兩人＿＿牽電線，心內真歡喜。」請問空格仔內揀佗一个語詞上適當?", "options": [{"value": "A", "text": "喙角"}, {"value": "B", "text": "目眉"}, {"value": "C", "text": "目睭"}, {"value": "D", "text": "喙䫌(tshuì-phué)"}], "answer": "C"}, {"number": 13, "question": "人講「人情留一線，日後好相看，做人毋通傷絕情，路頭路尾『相拄』會著。」請問『相拄』嘛會使用佗一个語詞代替?", "options": [{"value": "A", "text": "相搪"}, {"value": "B", "text": "相觸"}, {"value": "C", "text": "相迵(thàng)"}, {"value": "D", "text": "相推"}], "answer": "A"}, {"number": 14, "question": "「經濟無好的歹年冬，若閣無健全的社會福利制度，真濟散赤家庭的生活就親像蜈蚣走入＿＿仝款，陷入絕境。」請問空格仔內揀佗一个選項較適合?", "options": [{"value": "A", "text": "狗仔岫(siū)"}, {"value": "B", "text": "鳥仔岫"}, {"value": "C", "text": "狗蟻岫"}, {"value": "D", "text": "貓仔岫"}], "answer": "C"}, {"number": 15, "question": "「䆀(bái)猴𠢕欠數」是講這个人按怎?", "options": [{"value": "A", "text": "共人討數"}, {"value": "B", "text": "袂曉算數"}, {"value": "C", "text": "揣人收數"}, {"value": "D", "text": "共人賖數"}], "answer": "D"}, {"number": 16, "question": "「你這隻＿＿，攏幾點矣閣毋去睏。」請問空格仔內揀佗一个選項上適當?", "options": [{"value": "A", "text": "暗光鳥"}, {"value": "B", "text": "長尾山娘"}, {"value": "C", "text": "烏鶖"}, {"value": "D", "text": "鴟鴞(bā-hio̍h)"}], "answer": "A"}, {"number": 17, "question": "有一句臺灣俗語講「做雞著筅(tshíng)，做人著反」，這句話內底的「反」佮下面佗 一个的「反」意思無仝款?", "options": [{"value": "A", "text": "反腹"}, {"value": "B", "text": "反車"}, {"value": "C", "text": "走反"}, {"value": "D", "text": "顛倒反"}], "answer": "C"}, {"number": 18, "question" ], "answer": "B"}, {"number": 7, "question": "若講起羅漢跤仔的心酸，有一句孽譎仔話講「＿＿，穿衫袚肩胛頭。」請問空格 仔內的語詞揀佗一个上適當?", "options": [{"value": "A", "text": "無依無倚"}, {"value": "B", "text": "無某無猴"}, {"value": "C", "text": "無要無緊"}, {"value": "D", "text": "無暝無日"}], "answer": "B"}, {"number": 8, "question": "「伊一世人食甲六十外，攏毋捌享受過，真正是＿＿。」請問空格仔內的語詞揀佗一 个無適當?", "options": [{"value": "A", "text": "歹命"}, {"value": "B", "text": "㾀(khiap)勢命"}, {"value": "C", "text": "帶身命"}, {"value": "D", "text": "乞食命"}], "answer": "C"}, {"number": 9, "question": "「阿華前一站仔生理做了失敗，散甲強欲＿＿，這馬食穿攏真凊彩。」請問空格仔內 的語詞揀佗一个上適當?", "options": [{"value": "A", "text": "吊脰(tiàu-tāu)"}, {"value": "B", "text": "吊頷"}, {"value": "C", "text": "吊癀"}, {"value": "D", "text": "吊鼎"}], "answer": "D"}, {"number": 10, "question": "請問「萬年筆」閣會使號做啥物筆?＿＿", "options": [{"value": "A", "text": "原子筆"}, {"value": "B", "text": "蠟筆"}, {"value": "C", "text": "鋼筆"}, {"value": "D", "text": "璇筆(suān-pit)"}], "answer": "C"}, {"number": 11, "question": "請問下面佗一个選項一定愛用著油?", "options": [{"value": "A", "text": "煎茶"}, {"value": "B", "text": "豆乾糋(tsìn)"}, {"value": "C", "text": "炰鰇魚"}, {"value": "D", "text": "煠(sa̍h)青菜"}], "answer": "B"}, {"number": 12, "question": "「伊昨暗啉(lim)酒啉甲掠兔仔，到今猶咧艱苦。」請問「掠兔仔」佮下面佗一个語 詞的意思仝款?", "options": [{"value": "A", "text": "出酒"}, {"value": "B", "text": "激酒"}, {"value": "C", "text": "興酒"}, {"value": "D", "text": "退酒"}], "answer": "A"}, {"number": 13, "question": "請問下面佗一个選項是一種臺灣料理的名稱?", "options": [{"value": "A", "text": "五筋膎(gōo-kin-kê)"}, {"value": "B", "text": "五加皮"}, {"value": "C", "text": "激五仁"}, {"value": "D", "text": "五柳居"}], "answer": "D"}, {"number": 14, "question": "「這領衫是羊毛的，洗的時陣愛注意，若無驚會 。」請問空格仔內的語詞揀佗一 个上適當?", "options": [{"value": "A", "text": "拹(hia̍p)水"}, {"value": "B", "text": "勼(kiu)水"}, {"value": "C", "text": "沐(bak)水"}, {"value": "D", "text": "欶水"}], "answer": "B"}, {"number": 15, "question": "「這个囡仔開始欲發喙齒矣!愛共圍一个「瀾垂(nuā-sê)」＿＿，衫仔才袂澹糊糊。請問「瀾 垂」這个語詞會使用下面佗一个代替?", "options": [{"value": "A", "text": "四淋垂"}, {"value": "B", "text": "頕(tàm)垂"}, { : "「這件代誌你去共講，伊見講嘛講袂伸捙。」是講伊這个人按怎?", "options": [{"value": "A", "text": "講話聽無"}, {"value": "B", "text": "愛應喙應舌"}, {"value": "C", "text": "真歹改變"}, {"value": "D", "text": "無好鬥陣"}], "answer": "C"}, {"number": 52, "question": "「遮的果子是欲用來拜好兄弟的。」請問下面佗一項果子較無著時?", "options": [{"value": "A", "text": "釋迦"}, {"value": "B", "text": "柑仔"}, {"value": "C", "text": "檨仔"}, {"value": "D", "text": "龍眼"}], "answer": "B"}, {"number": 53, "question": "「伊真愛生話，定定講一寡有空無榫(sún)的代誌。」是講這个人按怎?", "options": [{"value": "A", "text": "講長短跤話"}, {"value": "B", "text": "空喙哺舌"}, {"value": "C", "text": "插喙插舌"}, {"value": "D", "text": "厚話興喋"}], "answer": "B"}, {"number": 54, "question": "「伊食飽閒閒無代誌，真愛揣人講天講地，講鱟桸(hāu-hia)講飯篱(pn̄g-lē)。」是講 這个人按怎?下面佗一个選項無適合?", "options": [{"value": "A", "text": "愛經絲(kenn-si)"}, {"value": "B", "text": "拍拉涼"}, {"value": "C", "text": "拍喙鼓"}, {"value": "D", "text": "盤喙錦"}], "answer": "D"}, {"number": 55, "question": "請問下面佗一个選項佮衫仔無關係?", "options": [{"value": "A", "text": "鈕仔空"}, {"value": "B", "text": "鈕鈕仔"}, {"value": "C", "text": "鈕衫"}, {"value": "D", "text": "後鈕"}], "answer": "D"}, {"number": 56, "question": "「買田愛揀好田底，娶某愛揀好娘嬭。」這句話是講揀對象佗一項上重要?", "options": [{"value": "A", "text": "田地愛濟"}, {"value": "B", "text": "後頭厝愛好額"}, {"value": "C", "text": "愛生做媠"}, {"value": "D", "text": "有好內在"}], "answer": "D"}, {"number": 57, "question": "「做雞著筅，做人著反。」是講咱做人愛按怎?", "options": [{"value": "A", "text": "骨力"}, {"value": "B", "text": "老實"}, {"value": "C", "text": "勥跤"}, {"value": "D", "text": "合作"}], "answer": "A"}, {"number": 58, "question": "「民以食為天，兩跤的食甲樓梯，四跤的食甲桌櫃。」意思是講人按怎?", "options": [{"value": "A", "text": "真垃圾"}, {"value": "B", "text": "真散食"}, {"value": "C", "text": "為非毿做"}, {"value": "D", "text": "重食"}], "answer": "D"}, {"number": 59, "question": "「你去買一寡糖仔餅來啖糝(tām-sám)一下。」請問「糖仔餅」會使用佗一个語詞替 換?", "options": [{"value": "A", "text": "四秀仔"}, {"value": "B", "text": "柑仔蜜"}, {"value": "C", "text": "芫荽(iân-sui)"}, {"value": "D", "text": "奶喙仔"}], "answer": "A"}, {"number": 60, "question": "「＿＿咱就坐計程車來去會場。」空格仔內，佗一个選項無適合?", "options": [{"value": "A", "text": "連鞭(liâm-mi)仔"}, {"value": "B", "text": "較停仔"}, {"value": "C", "text": "等咧"}, {"value": "D", "text": "一睏仔"}], "answer": "D"}, {"number": 61, "question": "「世間人百百款，有人是直人講直話;有人講話就彎彎曲曲，佮咱講一款話，佮別人 閣講另外一款話，這種人真是＿＿，咱愛提防才著。」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "一喙掛雙舌"}, {"value": "B", "text": "一面抹壁雙面光"}, {"value": "C", "text": "雙面刀鬼"}, {"value": "D", "text": "死道友，無死貧道"}], "answer": "C"}, {"number": 62, "question": "「這禮拜欲大摒掃，愛共厝內的物件＿＿咧。」請問空格仔內揀佗一个無適當?", "options": [{"value": "A", "text": "撓撓(ngiáu)"}, {"value": "B", "text": "款款"}, {"value": "C", "text": "抾抾"}, {"value": "D", "text": "窮窮"}], "answer": "A"}, {"number": 63, "question": "「小明為著欲揣落佇塗跤的一枝針，專工走去買一个＿＿。」請問空格仔內揀佗 一个上適當?", "options": [{"value": "A", "text": "召鏡"}, {"value": "B", "text": "耳鏡"}, {"value": "C", "text": "譀鏡"}, {"value": "D", "text": "千里鏡"}], "answer": "C"}, {"number": 64, "question": "「伊欠人一筆數，這馬才咧四界＿＿。」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "傱(tsông)錢"}, {"value": "B", "text": "塌錢"}, {"value": "C", "text": "抾錢"}, {"value": "D", "text": "開錢"}], "answer": "A"}, {"number": 65, "question": "「我食凊糜張等你! 」請問，講這句話的人按怎?", "options": [{"value": "A", "text": "枵飽吵"}, {"value": "B", "text": "共人唱聲"}, {"value": "C", "text": "想欲食糜"}, {"value": "D", "text": "請你食糜"}], "answer": "B"}, {"number": 66, "question": "「伊對彼粒璇石手指真＿＿，想欲共買轉去。」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "凝心"}, {"value": "B", "text": "僥心"}, {"value": "C", "text": "激心"}, {"value": "D", "text": "煞心"}], "answer": "D"}, {"number": 67, "question": "「這問厝傷舊，愛＿＿一下，看起來才會較媠! 」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "翻"}, {"value": "B", "text": "起"}, {"value": "C", "text": "蓄(hak)"}, {"value": "D", "text": "稅"}], "answer": "A"}, {"number": 68, "question": "「 兜生活的重擔，攏是伊咧『擔』。」其中的『擔』和空格仔內佗一个語詞的發 音相仝?", "options": [{"value": "A", "text": "收擔"}, {"value": "B", "text": "擔憂"}, {"value": "C", "text": "承擔"}, {"value": "D", "text": "攕擔(tshiam-tann)"}], "answer": "D"}, {"number": 69, "question": "「伊食物件有夠＿＿，定定賰(tshun)一半就欲挕捒(hìnn-sak)。」請問空格仔內揀佗 一个無適當?", "options": [{"value": "A", "text": "抾拾(khioh-si̍p)"}, {"value": "B", "text": "拍損"}, {"value": "C", "text": "討債"}, {"value": "D", "text": "匪類"}], "answer": "A"}, {"number": 70, "question": "「你按呢過日傷冗剩(liōng-siō)矣! 」這句話是講這个人生活過了按怎?", "options": [{"value": "A", "text": "散赤"}, {"value": "B", "text": "富裕"}, {"value": "C", "text": "抾捔"}, {"value": "D", "text": "媠氣"}], "answer": "B"}, {"number": 71, "question": "「囡仔人尻川三斗火」是比喻囡仔人按怎?", "options": [{"value": "A", "text": "火氣大"}, {"value": "B", "text": "歹性地"}, {"value": "C", "text": "毋驚寒"}, {"value": "D", "text": "坐袂牢"}], "answer": "C"}, {"number": 72, "question": "「伊這个人足厚譴損(khiàn-sńg)。」請問「厚譴損」是講這个人按怎?", "options": [{"value": "A", "text": "傷過迷信"}, {"value": "B", "text": "愛共人批評"}, {"value": "C", "text": "𠢕開錢"}, {"value": "D", "text": "歹癖一堆"}], "answer": "A"}, {"number": 73, "question": "「小明的舊車去褪人(thǹg--lâng)。」這句話是講小明的車按怎?", "options": [{"value": "A", "text": "過予別人"}, {"value": "B", "text": "挵著別人"}, {"value": "C", "text": "佮人相舂"}, {"value": "D", "text": "軋著人"}], "answer": "A"}, {"number": 74, "question": "「拄咧學行的囡仔足𠢕跋倒，所以需要一台＿＿。」請問空格仔內揀佗一个上適 當?", "options": [{"value": "A", "text": "五分車"}, {"value": "B", "text": "孔明車"}, {"value": "C", "text": "奶母車"}, {"value": "D", "text": "蟧蜈車"}], "answer": "D"}, {"number": 75, "question": "「這間餐廳的菜色誠＿＿，逐家攏真滿意。」請問空格仔內揀佗一个無適當?", "options": [{"value": "A", "text": "腥臊"}, {"value": "B", "text": "紲喙"}, {"value": "C", "text": "腌臢"}, {"value": "D", "text": "幼路"}], "answer": "C"}, {"number": 76, "question": "下面佗一个選項袂使提來食?", "options": [{"value": "A", "text": "四秀仔"}, {"value": "B", "text": "豬菜"}, {"value": "C", "text": "狗母鍋"}, {"value": "D", "text": "麵猴"}], "answer": "C"}, {"number": 77, "question": "「這條菜瓜食起來＿＿，無好食。」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "柴柴"}, {"value": "B", "text": "汫汫"}, {"value": "C", "text": "柯柯"}, {"value": "D", "text": "皮皮"}], "answer": "C"}, {"number": 78, "question": "「我頭拄仔去食著膨餅。」這句話是講這个人按怎?", "options": [{"value": "A", "text": "予人反背"}, {"value": "B", "text": "予人請"}, {"value": "C", "text": "予人呵咾"}, {"value": "D", "text": "予人碰釘(phòng-ting)"}], "answer": "D"}, {"number": 79, "question": "「我的嚨喉＿＿著一支魚刺。」請問空格仔內揀佗一个上適當?", "options": [{"value": "A", "text": "拌(puānn)"}, {"value": "B", "text": "挾"}, {"value": "C", "text": "㧎(khê)"}, {"value": "D", "text": "摻"}], "answer": "C"}], "id": ""}, {"title": "第六部分社經文教", "questions": [{"number": 1, "question": "「食肉食三層(sam-tsân)，看戲看亂彈(lān-thân)。」請問「亂彈」屬於戲曲中的啥物 音樂?", "options": [{"value": "A", "text": "南管"}, {"value": "B", "text": "北管"}, {"value": "C", "text": "歌仔戲"}, {"value": "D", "text": "車鼓陣"}], "answer": "B"}, {"number": 2, "question": "「桃園三結義，劉備、關公佮張飛。」請問 三人是啥物關係?", "options": [{"value": "A", "text": "表兄弟"}, {"value": "B", "text": "親兄弟"}, {"value": "C", "text": "叔伯兄弟"}, {"value": "D", "text": "換帖的"}], "answer": "D"}, {"number": 3, "question": "「我下晡會共錢匯入去你的 內底。」下面佗一个語詞無適合?", "options": [{"value": "A", "text": "口座"}, {"value": "B", "text": "戶頭"}, {"value": "C", "text": "寄金簿仔"}, {"value": "D", "text": "戶橂(hōo-tīng)"}], "answer": "D"}, {"number": 4, "question": "俗語講: 「戲館邊的豬母，袂曉歕簫嘛會＿＿。」請問空格仔內的語詞揀佗一个上適 當?", "options": [{"value": "A", "text": "跳舞"}, {"value": "B", "text": "拍拍(phah-phik)"}, {"value": "C", "text": "唱曲"}, {"value": "D", "text": "挵鼓"}], "answer": "B"}, {"number": 5, "question": "「阿春泅水的速度真緊，定定代表學校出去參加比賽。」請問下面佗一个選項無可能 是伊比賽的項目?", "options": [{"value": "A", "text": "掠篙泅"}, {"value": "B", "text": "死囡仔䖙(the)"}, {"value": "C", "text": "沐沐泅"}, {"value": "D", "text": "四跤仔泅"}], "answer": "C"}, {"number": 6, "question": "「阿兄講想欲去夜市仔看人 賣膏藥。」請問空格仔內的語詞揀佗一个上適當?", "options": [{"value": "A", "text": "拍球"}, {"value": "B", "text": "拍獵"}, {"value": "C", "text": "拍拳頭"}, {"value": "D", "text": "拍鐵"}], "answer": "C"}, {"number": 7, "question": "「伊上愛膨風，你毋好予伊騙去。」請問「膨風」這个語詞袂當用下面佗一个代替?", "options": [{"value": "A", "text": "臭彈"}, {"value": "B", "text": "放臭屁"}, {"value": "C", "text": "歕雞胿仔"}, {"value": "D", "text": "嘐潲(hau-siâu)"}], "answer": "C"}, {"number": 8, "question": "請問佇臺灣一般人所講的「乞食琴」，是啥物樂器?", "options": [{"value": "A", "text": "鋼琴"}, {"value": "B", "text": "小提琴"}, {"value": "C", "text": "口琴"}, {"value": "D", "text": "月琴"}], "answer": "D"}, {"number": 9, "question": "「咱逐家做伙來耍掩咯雞。」請問「掩咯雞」這个語詞會使用下面佗一个代替?", "options": [{"value": "A", "text": "走相掠"}, {"value": "B", "text": "扮公伙仔"}, {"value": "C", "text": "覕相揣"}, {"value": "D", "text": "幌韆鞦"}], "answer": "C"}, {"number": 10, "question": "「阮細漢的時上愛耍蹌跤雞(tshiáng-kha-ke)。」請問「蹌跤雞」這个語詞會使用下 面佗一个代替?", "options": [{"value": "A", "text": "跳年"}, {"value": "B", "text": "跳索仔"}, {"value": "C", "text": "跳加冠"}, {"value": "D", "text": "跳童"}], "answer": "A"}, {"number": 11, "question": "「這擺比賽的順序，我感覺＿＿較公平。」請問空格仔內的語詞揀佗一个上適當?", "options": [{"value": "A", "text": "輪班"}, {"value": "B", "text": "輪鬮(lûn-khau)"}, {"value": "C", "text": "轉輪"}, {"value": "D", "text": "輪值"}], "answer": "B"}, {"number": 12, "question": "請問下面佗一項樂器毋是用歕的?", "options": [{"value": "A", "text": "吊鬼仔"}, {"value": "B", "text": "烏笛仔(oo-ta̍t-á)"}, {"value": "C", "text": "𥰔(phín)仔"}, {"value": "D", "text": "鼓吹"}], "answer": "A"}, {"number": 13, "question": "「阿明佮阿華兩人定定相招去＿＿抾紅點仔。」請問空格仔內的語詞揀佗一个上適 當?", "options": [{"value": "A", "text": "奕"}, {"value": "B", "text": "耍"}, {"value": "C", "text": "拍"}, {"value": "D", "text": "揀"}], "answer": "A"}, {"number": 14, "question": "「伊力頭真大，見擺比賽＿＿攏有真好的成績」。請問空格仔內的語詞揀佗一个上 無適當?", "options": [{"value": "A", "text": "相偃(ián)"}, {"value": "B", "text": "搝(khiú)大索"}, {"value": "C", "text": "遏(at)手把"}, {"value": "D", "text": "拆腿"}], "answer": "C"}, {"number": 15, "question": "「頭家做伊走，人客做一睏來一、二十个，害店員佇店裡＿＿。」請問空格仔內的 語詞揀佗一个上適當?", "options": [{"value": "A", "text": "徛泅"}, {"value": "B", "text": "拍滂泅"}, {"value": "C", "text": "掠篙泅"}, {"value": "D", "text": "沐沐泅"}], "answer": "D"}, {"number": 16, "question": "「阮阿公平常時，上愛去老人活動中心，唸歌佮＿＿弦仔。」請問空格仔內的語詞 揀佗一个上適當?", "options": [{"value": "A", "text": "挨"}, {"value": "B", "text": "拉"}, {"value": "C", "text": "扭"}, {"value": "D", "text": "搝"}], "answer": "A"}, {"number": 17, "question": "請問下面佗一个選項無適合囡仔耍?", "options": [{"value": "A", "text": "尪仔標"}, {"value": "B", "text": "四色牌"}, {"value": "C", "text": "干樂(kan-lo̍k)"}, {"value": "D", "text": "搖鼓瑯(iô-kóo-long)"}], "answer": "B"}, {"number": 18, "question": "「咱臺灣七月普渡，攏會攢真濟物件來祭拜好兄弟」＿＿，請問「好兄弟」嘛會當叫做啥 物?", "options": [{"value": "A", "text": "好朋友"}, {"value": "B", "text": "老大公"}, {"value": "C", "text": "老大人"}, {"value": "D", "text": "地基主"}], "answer": "B"}, {"number": 19, "question": "俗語講:「＿＿順話尾，假童害眾人。」做人千萬毋通傷過迷信。請問空格仔內的 語詞揀佗一个上適當?", "options": [{"value": "A", "text": "算命仙"}, {"value": "B", "text": "先生媽"}, {"value": "C", "text": "司公"}, {"value": "D", "text": "尪姨"}], "answer": "D"}, {"number": 20, "question": "「伊足迷信的，萬項代誌攏愛＿＿決定。」請問空格仔內的語詞揀佗一个上適當?", "options": [{"value": "A", "text": "跋桮"}, {"value": "B", "text": "跋筊"}, {"value": "C", "text": "陰桮"}, {"value": "D", "text": "象桮"}], "answer": "A"}, {"number": 21, "question": "「昨昏 兜神桌頂的香爐發爐，敢講有代誌會發生。」請問「神桌」閣會使號做啥 物?", "options": [{"value": "A", "text": "八仙桌"}, {"value": "B", "text": "煏桌"}, {"value": "C", "text": "桌頭"}, {"value": "D", "text": "尪架桌"}], "answer": "D"}, {"number": 22, "question": "「古早替人收驚的司公，定定會叫囡仔食爐丹。」請問「爐丹」就是啥物?", "options": [{"value": "A", "text": "香煙"}, {"value": "B", "text": "香火"}, {"value": "C", "text": "香烌(hu) (D 線香"}], "answer": "C"}, {"number": 23, "question": "人講:「食尾牙面憂憂，食頭牙撚喙鬚。」請問「頭牙」是佗一工?", "options": [{"value": "A", "text": "農曆二月十五"}, {"value": "B", "text": "農曆二月初二"}, {"value": "C", "text": "新曆三月十五"}, {"value": "D", "text": "新曆三月初三"}], "answer": "B"}, {"number": 24, "question": "臺灣人辦喪事、做七有時會表演一寡特技，咱叫做「司公＿＿。」請問空格仔內揀 佗一个上適當?", "options": [{"value": "A", "text": "弄龍"}, {"value": "B", "text": "弄鐃(lāng-lâu)"}, {"value": "C", "text": "弄獅"}, {"value": "D", "text": "弄風"}], "answer": "B"}, {"number": 25, "question": "「逐年清明，阮攏轉去南部培墓。」請問「培墓」這个語詞換做下面佗一个無適當?", "options": [{"value": "A", "text": "探墓厝"}, {"value": "B", "text": "掃墓"}, {"value": "C", "text": "挂紙"}, {"value": "D", "text": "拗紙"}], "answer": "D"}, {"numb function render(){if(!run.length)return;const q=run[idx];progress.textContent=`第 ${idx+1} / ${run.length} 題・${q.section}・原題第 ${q.number} 題`;questionText.textContent=q.question||'（題幹文字需要人工確認）';optionsBox.innerHTML='';feedback.classList.add('hidden');feedback.innerHTML='';
const chosen=answered[idx];const opts=q.options.map(o=>({...o}));
opts.forEach(o=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${o.value}</span><span></span>`;b.children[1].textContent=o.text||'（此選項文字需要人工確認）';b.disabled=chosen!==undefined;if(chosen!==undefined){if(o.value===q.answer)b.classList.add('correct');else if(o.value===chosen)b.classList.add('wrong')}
b.addEventListener('click',()=>{answered[idx]=o.value;render();});optionsBox.appendChild(b)});
if(chosen!==undefined){feedback.classList.remove('hidden');const right=q.options.find(o=>o.value===q.answer);const chosenOpt=q.options.find(o=>o.value===chosen);feedback.innerHTML=`<strong>${chosen===q.answer?'答著矣！':'再試一下！'}　正確答案：${q.answer}</strong><div>正確選項：${escapeHtml(right?.text||'')}</div>`}
prevBtn.disabled=idx===0;nextBtn.disabled=chosen===undefined;nextBtn.textContent=idx===run.length-1?'完成本回':'下一題';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
prevBtn.addEventListener('click',()=>{if(idx>0){idx--;render()}});
nextBtn.addEventListener('click',()=>{if(idx<run.length-1){idx++;render()}else{const done=Object.keys(answered).length;questionText.textContent=`本回完成！你已作答 ${done} 題。`;optionsBox.innerHTML='';feedback.classList.add('hidden');progress.textContent='練習完成';prevBtn.disabled=true;nextBtn.disabled=true;nextBtn.textContent='下一題';}});
document.getElementById('startBtn').addEventListener('click',start);
function init(){start()}
init();
</script>
</body></html>
