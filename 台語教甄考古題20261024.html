<script>
const QUESTIONS=[{"id":1,"number":"01","category":"語詞語法","question":"伊自細漢就和厝裡的人講臺語，這馬講甲足__________的，後來去做臺語配音員，人足愛倩伊的。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"精光"},{"value":"B","text":"奢颺"},{"value":"C","text":"端的"},{"value":"D","text":"撆紮"}],"answer":"C"},{"id":2,"number":"02","category":"語詞語法","question":"阮囝佇學校拍籃球無細膩跋倒，__________tauh一下缺一角。少年人愛媠，佇頭前歹看，好佳哉去齒科補好矣，這馬就敢笑矣。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"後齻"},{"value":"B","text":"屎桮齒"},{"value":"C","text":"奶齒"},{"value":"D","text":"角齒"}],"answer":"B"},{"id":3,"number":"03","category":"語詞語法","question":"阿母共_____囥佇衫櫥仔內，按呢虼蚻才袂走入去，毋過衫穿佇身軀䆀味䆀味。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"臭礬"},{"value":"B","text":"臭油"},{"value":"C","text":"臭腥仔"},{"value":"D","text":"臭藥丸仔"}],"answer":"A"},{"id":4,"number":"04","category":"語詞語法","question":"某的，咱囝的個性誠「十角」，定共你氣惱，嘛誠多謝你費心神咧共斟酌，體諒我較無閒。請問「十角」佮下底佗一个選項上倚意？","options":[{"value":"A","text":"雜插"},{"value":"B","text":"雜唸"},{"value":"C","text":"散仙"},{"value":"D","text":"龜毛"}],"answer":"C"},{"id":5,"number":"05","category":"語詞語法","question":"恁孫當咧學行路，佇大埕捒彼台有聲的_____，有夠古錐。有練有差，另工就走敢若飛囉！你敢逐會著？請問空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"銅管仔車"},{"value":"B","text":"烏頭仔車"},{"value":"C","text":"野雞仔車"},{"value":"D","text":"雞鵤仔車"}],"answer":"D"},{"id":6,"number":"06","category":"語詞語法","question":"古早人欲有_____衫通穿，著家己經布來做，費氣閣厚工。空格仔內底佗一个選項無適當？","options":[{"value":"A","text":"一領"},{"value":"B","text":"兩領"},{"value":"C","text":"一兩領"},{"value":"D","text":"一領仔"}],"answer":"B"},{"id":7,"number":"07","category":"語詞語法","question":"彼張銀票毋但舊舊舊，閣皺襞襞，專_____，敢會使佮你換新的？我的khî-móo-tsih 會較好。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"áu-bân"},{"value":"B","text":"áu-pôo"},{"value":"C","text":"áu-ut"},{"value":"D","text":"áu-hûn"}],"answer":"D"},{"id":8,"number":"08","category":"語詞語法","question":"生理人_____較活，若阮作穡人，看天食飯，就較_____。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"喙水；乏"},{"value":"B","text":"錢水；乏"},{"value":"C","text":"油湯；渴"},{"value":"D","text":"油滓；渴"}],"answer":"B"},{"id":9,"number":"09","category":"語詞語法","question":"下底佗一種樹欉的葉仔佇秋冬的季節會轉紅？看著誠有詩意，閣有誠濟人會起去山頂看。","options":[{"value":"A","text":"ka-tang"},{"value":"B","text":"png-á"},{"value":"C","text":"khóo-līng-á"},{"value":"D","text":"tshîng-á/ tsîng-á"}],"answer":"B"},{"id":10,"number":"10","category":"語詞語法","question":"Khì káng-á-pinn bé「hiān-lâu-á」, m̄-nā tshinn mā ke tsin sio̍k. 「 」的漢字用下底佗一 个選項上適當？","options":[{"value":"A","text":"獻樓仔"},{"value":"B","text":"獻漏仔"},{"value":"C","text":"現撈仔"},{"value":"D","text":"現流仔"}],"answer":"D"},{"id":11,"number":"11","category":"語詞語法","question":"阿芬仔，愛留寡予人探聽咧，緊共房間的彼幾包_______提出來擲，毋通囤咧，才袂規間遐_______，咧欲生蟲矣。空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"糞埽；垃圾"},{"value":"B","text":"垃圾；驚人"},{"value":"C","text":"糞埽；齷齪"},{"value":"D","text":"垃圾；囉嗦"}],"answer":"A"},{"id":12,"number":"12","category":"語詞語法","question":"伊是出名的________，一寡細間的店，予伊那拐那唬，遐拈遐佔，攏予食食去矣。 空格仔內底佗一个選項上適當？","options":[{"value":"A","text":"剪綹仔"},{"value":"B","text":"生理虎"},{"value":"C","text":"喑噁的"},{"value":"D","text":"浮浪貢的"}],"answer":"B"},{"id":13,"number":"13","category":"語詞語法","question":"下底佗一句的閩南語用字、語詞、語法是正確的？","options":[{"value":"A","text":"我日時做工課上無閒，下晡下班才會去賊仔市買菜，遐的物件有影較俗"},{"value":"B","text":"風颱咧欲來矣，咱兜的冰箱空空空，咱著緊來去款寡菜，才袂無物通食"},{"value":"C","text":"逐家先品予好，若奕輸毋通起屁面哦"},{"value":"D","text":"伊這改的表現真漏氣，有夠失體面"}],"answer":"B"},{"id":14,"number":"14","category":"語詞語法","question":"因為疫情嚴重，政府規定出門愛掛喙罨。少年家阿俊想講若照規定行，伊的緣投仔 面就無人看會著矣，哪會有查某囡仔會來佮伊開講咧？伊不時都共喙罨剝落來提佇 手裡，目睭褫甲大大蕊咧相、咧唌查某囡仔。伊無掛喙罨，人驚予伊的瀾鬚噴著， 顛倒無人敢倚近伊。欠喙罨的保護，尾仔伊真正予人穢著，有夠害。咱會當用佗一句話形容阿俊的情形？","options":[{"value":"A","text":"無補顛倒惱"},{"value":"B","text":"捾籃仔假燒金"},{"value":"C","text":"三八假賢慧"},{"value":"D","text":"大目新娘揣無灶"}],"answer":"A"},{"id":15,"number":"15","category":"語詞語法","question":"「食飯若武松拍虎，作穡若桃花過渡。」這句俗諺是咧形容啥？","options":[{"value":"A","text":"武松真勇猛"},{"value":"B","text":"食好做輕可"},{"value":"C","text":"桃花姊仔會撐渡"},{"value":"D","text":"勤儉較有底，浪費不成家"}],"answer":"B"},{"id":16,"number":"16","category":"語詞語法","question":"類似「食飯若武松拍虎」的語意，食飯若_____，會當添佗一个詞彙？","options":[{"value":"A","text":"龜咧peh壁"},{"value":"B","text":"猛虎落山"},{"value":"C","text":"魚仔泅水"},{"value":"D","text":"飛龍在天"}],"answer":"B"},{"id":17,"number":"17","category":"語詞語法","question":"類似「作穡若桃花過渡」的語意，作穡若... ，會當添佗一个詞彙？","options":[{"value":"A","text":"龜咧趖"},{"value":"B","text":"雞筅塗"},{"value":"C","text":"三戰呂布"},{"value":"D","text":"蜈蜞咬蛤"}],"answer":"A"},{"id":18,"number":"18","category":"語詞語法","question":"無錢嘛會當做善事，親像我攏會捐_____做_____，空格仔照順序愛添佗兩个詞？ (甲)義工 (乙)環保 (丙)發票 (丁)血","options":[{"value":"A","text":"甲丙"},{"value":"B","text":"丙丁"},{"value":"C","text":"丙甲"},{"value":"D","text":"丁丙"}],"answer":"C"},{"id":19,"number":"19","category":"語詞語法","question":"佮親近的人手牽手，按呢相攬相唚，煞袂輸是邀請死神來跳最後的thàn-gòo。這段 話有可能是咧形容啥物時期的情境？","options":[{"value":"A","text":"愛情"},{"value":"B","text":"人災"},{"value":"C","text":"戰爭"},{"value":"D","text":"舞會"}],"answer":"B"},{"id":20,"number":"20","category":"語詞語法","question":"用青春佮血汗經過彼場戰爭的臺灣人，干焦_____留予in做為記。空格仔會當添佗幾个詞？ (甲)疏開這个詞 (乙)手指一跤 (丙)空喙的khî (丁)塚仔埔","options":[{"value":"A","text":"甲乙丙"},{"value":"B","text":"乙丙丁"},{"value":"C","text":"甲丙丁"},{"value":"D","text":"甲乙丁"}],"answer":"C"},{"id":21,"number":"21","category":"語詞語法","question":"下跤遮的臺北市的地號名，佗一个發音佮使用的漢字讀音有對應？","options":[{"value":"A","text":"木柵"},{"value":"B","text":"大龍峒"},{"value":"C","text":"景美"},{"value":"D","text":"關渡"}],"answer":"A"},{"id":22,"number":"22","category":"語詞語法","question":"「未食________，破裘毋甘放」是講猶未過啥物年節/食過啥物物件，熱人就無算真正到矣？","options":[{"value":"A","text":"上元/圓仔"},{"value":"B","text":"清明/潤餅"},{"value":"C","text":"五月節/肉粽"},{"value":"D","text":"中秋/中秋餅"}],"answer":"C"},{"id":23,"number":"23","category":"語詞語法","question":"以下佗一个閩南語詞毋是「輕聲詞」？","options":[{"value":"A","text":"遐的"},{"value":"B","text":"李家"},{"value":"C","text":"拍無去"},{"value":"D","text":"往過"}],"answer":"D"},{"id":24,"number":"24","category":"語詞語法","question":"下面佗一个標音是錯誤的？","options":[{"value":"A","text":"超音波 tshiau-in-pho"},{"value":"B","text":"親家公 tshin-ke-kong"},{"value":"C","text":"中中仔 tiong-tiong--á"},{"value":"D","text": "},{"id":181,"number":"181","category":"語詞語法","question":"「你做你的，欲講_____伊講。」請問空格仔內添佗一个較適當？","options":[{"value":"A","text":"原在"},{"value":"B","text":"據在"},{"value":"C","text":"自在"},{"value":"D","text":"常在"}],"answer":"B"},{"id":182,"number":"182","category":"語詞語法","question":"請問下面的比較句內底，佗一句無合臺灣閩南語的講法？","options":[{"value":"A","text":"阿華和阿明平懸"},{"value":"B","text":"阿華較懸過阿英"},{"value":"C","text":"阿華並阿英較懸"},{"value":"D","text":"阿英矮過阿華"}],"answer":"D"},{"id":183,"number":"183","category":"語詞語法","question":"下面臺灣閩南語詞彙的使用，佗一句是正確的？","options":[{"value":"A","text":"伊足愛抾「銅管仔」，因為伊是咧做鼓吹的。"},{"value":"B","text":"伊是做「牽猴仔」的，愛去動物園上班。"},{"value":"C","text":"歌仔戲的神仙攏會攑一枝若「蠓捽仔」的物件。"},{"value":"D","text":"這个裁縫的「剪綹仔」技術誠好。"}],"answer":"C"},{"id":184,"number":"184","category":"語詞語法","question":"下面臺灣閩南語詞彙的使用，佗一句是正確的？","options":[{"value":"A","text":"這間店強欲倒矣，頭家做伊走，放頭家娘佇遐「沐沐泅」。"},{"value":"B","text":"這个囡仔規工共老母「扲牢牢」，真司奶。"},{"value":"C","text":"欲買電影票的人排隊排甲「挐氅氅」，實在無規矩。"},{"value":"D","text":"這台車「油洗洗」，緊共洗予清氣。"}],"answer":"A"},{"id":185,"number":"185","category":"語詞語法","question":"「大頭丁仔歕雞胿，東西南北講一堆，天生一枝_____喙，講甲三更免喘氣。」(施福珍〈大頭丁仔〉)請問表示口才真好的「 喙」空格仔內底適合添入下面佗一个詞？","options":[{"value":"A","text":"媒人"},{"value":"B","text":"璇石"},{"value":"C","text":"鴨母"},{"value":"D","text":"港仔"}],"answer":"B"},{"id":186,"number":"186","category":"語詞語法","question":"「阿彰佮阿明這兩个換帖的感情真好，連車嘛仝色水。」請問這句話內底「換帖的」是啥物意思？","options":[{"value":"A","text":"in放帖仔予對方"},{"value":"B","text":"in有姻親關係"},{"value":"C","text":"in有結拜關係"},{"value":"D","text":"in的車色水媠"}],"answer":"C"},{"id":187,"number":"187","category":"語詞語法","question":"老爸對後生講：「你的橐袋仔內一定是袋磅子。」照這句話的意思，老爸對後生的態度按怎？","options":[{"value":"A","text":"o-ló"},{"value":"B","text":"khau-sé"},{"value":"C","text":"bô-nāi"},{"value":"D","text":"iàn-khì"}],"answer":"B"},{"id":188,"number":"188","category":"語詞語法","question":"「我做一塊薁蕘(ò-giô)，成本毋但三十箍，你欲叫我賣你二十箍，你欲叫我____ 喔？」請問空格仔內揀佗一个上適當？","options":[{"value":"A","text":"歹趁"},{"value":"B","text":"倒塌"},{"value":"C","text":"了尾"},{"value":"D","text":"食家己"}],"answer":"B"},{"id":189,"number":"189","category":"語詞語法","question":"「阿媽老歲仔目，攏愛用____，才有法度看報紙。」請問空格仔內揀佗一个選 項上適當？","options":[{"value":"A","text":"召鏡"},{"value":"B","text":"耳鏡"},{"value":"C","text":"譀鏡"},{"value":"D","text":"千里鏡"}],"answer":"C"},{"id":190,"number":"190","category":"語詞語法","question":"「阿寶人面闊，____真濟，定定予in某嫌開銷傷重。」請問空格仔內揀佗一个上適當？","options":[{"value":"A","text":"人緣"},{"value":"B","text":"名聲"},{"value":"C","text":"面水"},{"value":"D","text":"陪綴"}],"answer":"D"},{"id":191,"number":"191","category":"語詞語法","question":"「雞仔災已經對香港_____甲規个亞洲地區，逐家著愛注意。」請問空格仔內揀佗一个選項上適當？","options":[{"value":"A","text":"展"},{"value":"B","text":"感"},{"value":"C","text":"流"},{"value":"D","text":"湠"}],"answer":"D"},{"id":192,"number":"192","category":"語詞語法","question":"「科技的社會，時間就是金錢，我哪有遐濟____時間，聽恁咧講遐的五四三的。」 請問空格仔內揀佗一个選項上適當？","options":[{"value":"A","text":"îng-kang"},{"value":"B","text":"phah-la-liâng"},{"value":"C","text":"pûn-ta̍h-ti"},{"value":"D","text":"liōng-siōng"}],"answer":"D"},{"id":193,"number":"193","category":"語詞語法","question":"咱有時會共雙音節的形容詞重複一擺，變做 ABAB 四音節的形容詞，親像「老實老實」。請問下面佗一个選項袂當按呢？","options":[{"value":"A","text":"勇敢"},{"value":"B","text":"清氣"},{"value":"C","text":"心適"},{"value":"D","text":"古意"}],"answer":"A"},{"id":194,"number":"194","category":"語詞語法","question":"「阿安佮阿成比阿發較討債，阿成較儉阿安。」請問下面的敘述佗一个正確？","options":[{"value":"A","text":"阿安比阿發較儉"},{"value":"B","text":"阿發較無阿成遐儉"},{"value":"C","text":"阿成較無阿安遐冇手"},{"value":"D","text":"阿成比阿安閣較冇手"}],"answer":"C"},{"id":195,"number":"195","category":"語詞語法","question":"以臺語傳統囡仔歌為例，對於民間文藝作品「囡仔歌最好的發展」這個議題，下面哪一個建議最好？","options":[{"value":"A","text":"囡仔歌原本稱為唸謠，是從念謠中選出來作為語文教學的材料，因此最好不要配樂，維持唸謠的方式才是正確的發展方向。"},{"value":"B","text":"囡仔歌最好要配樂，我們看到歐美的童謠大多是配樂的，因為只有唱歌的方式才能增加趣味，這才是囡仔歌發展的方向。"},{"value":"C","text":"囡仔歌或稱為童謠，所謂「謠」是要講究音樂性的，因此要配樂，這才是囡仔歌正確的發展方向。"},{"value":"D","text":"囡仔歌要不要配樂，並非最重要的，重要的是要內容充實，講究道德規範的傳承，重視臺灣文化的傳遞，因此囡仔歌內容的提昇，才是囡仔歌這種兒童文學體制的發展方向。"}],"answer":"A"},{"id":196,"number":"196","category":"語詞語法","question":"作為教師，不免要為學生修改語句或文章。如果要為臺灣閩南語「甲三塊銀提互我」這句話進行修改，下面四個修改例子，哪個最好、最道地？","options":[{"value":"A","text":"共三箍銀提互我"},{"value":"B","text":"共三箍銀摕予我"},{"value":"C","text":"提三箍銀予我"},{"value":"D","text":"共三箍銀提予我"}],"answer":"C"},{"id":197,"number":"197","category":"語詞語法","question":"臺灣俗諺講人「一面抹壁雙面光」是啥物意思？","options":[{"value":"A","text":"口齒伶俐"},{"value":"B","text":"吹牛太過"},{"value":"C","text":"做人圓融"},{"value":"D","text":"一舉兩得"}],"answer":"C"},{"id":198,"number":"198","category":"語詞語法","question":"以下佗一个閩南語詞的內部結構是「主謂結構」？","options":[{"value":"A","text":"戇直"},{"value":"B","text":"勥跤"},{"value":"C","text":"地動"},{"value":"D","text":"剾洗"}],"answer":"C"},{"id":199,"number":"199","category":"語詞語法","question":"以下佗一个閩南語俗諺是「被動句」？","options":[{"value":"A","text":"坐予正，得人疼。"},{"value":"B","text":"樹頭徛予在，毋驚樹尾做風颱。"},{"value":"C","text":"收瀾收予焦，予你生一个有𡳞脬。"},{"value":"D","text":"好心予雷唚。"}],"answer":"D"},{"id":200,"number":"200","category":"語詞語法","question":"以下佗一个選項引號內底的詞毋是詞組，已經詞彙化變做複合詞？","options":[{"value":"A","text":"伊是一个「食菜」人。"},{"value":"B","text":"囡仔人攏愛耍「風吹」。"},{"value":"C","text":"細漢無讀冊，大漢做「青盲牛」。"},{"value":"D","text":"寒天免洗身軀，洗「跤手」就好。"}],"answer":"D"},{"id":201,"number":"201","category":"語詞語法","question":"以下佗一个選項內底的詞內部結構佮其他三个無仝？","options":[{"value":"A","text":"細漢"},{"value":"B","text":"喙焦"},{"value":"C","text":"頭毛"},{"value":"D","text":"欶管"}],"answer":"B"},{"id":202,"number":"202","category":"語詞語法","question":"臺灣閩南語的音韻系統無佗一種語音成分？","options":[{"value":"A","text":"舌根鼻音"},{"value":"B","text":"前高圓唇元音"},{"value":"C","text":"雙脣濁塞音"},{"value":"D","text":"後高圓唇元音"}],"answer":"B"},{"id":203,"number":"203","category":"語詞語法","question":"臺灣國語的聲調有「四聲」，加上輕聲，另外還有「四聲」的變調，因此，其聲調多少可以利用來教學臺灣閩南語的字調（不含變調）。如果對比臺灣國語和臺灣閩南語的字調用來教學，下列四個敘述何者最佳？","options":[{"value":"A","text":"臺灣國語的陽平聲和臺灣閩南語的陽平字調相近，臺灣國語的去聲調值和臺灣閩南語的陰上聲調值相當相似。"},{"value":"B","text":"臺灣國語的上聲本調和臺灣閩南語的陽平字調調型相似、高低不同，臺灣國語的輕聲相當於臺灣閩南語的入聲字調。"},{"value":"C","text":"臺灣國語的陰平本調和臺灣閩南語的陰平字調調型相似、高低不同，臺灣國語的輕聲和臺灣閩南語的入聲字調調型相似、調值不同。"},{"value":"D","text":"臺灣國語的二字詞，其前一字的上聲在其他上聲字前面，所發生的變調調值，和臺灣閩南語的陽平字調調型相似，臺灣國語的輕聲和臺灣閩南語的輕聲字調大體相同。"}],"answer":"A"},{"id":204,"number":"204","category":"語詞語法","question":"重疊形式的加強作用是閩南語特有的造詞方式，下列哪一項是形容詞的疊字？","options":[{"value":"A","text":"沖沖滾"},{"value":"B","text":"颺颺飛"},{"value":"C","text":"溜溜去"},{"value":"D","text":"燒滾滾"}],"answer":"D"},{"id":205,"number":"205","category":"語詞語法","question":"佗一个選項毋是閩南語的次方言？","options":[{"value":"A","text":"廈門話"},{"value":"B","text":"潮州話"},{"value":"C","text":"惠安話"},{"value":"D","text":"福州話"}],"answer":"D"},{"id":206,"number":"206","category":"語詞語法","question":"用臺語報電話號碼的時，以下佗一个號碼的數字毋是讀冊音？","options":[{"value":"A","text":"0"},{"value":"B","text":"3"},{"value":"C","text":"6"},{"value":"D","text":"7"}],"answer":"A"},{"id":207,"number":"207","category":"語詞語法","question":"以下佗一个選項引號內底的臺灣閩南語用字毋是「本字」？","options":[{"value":"A","text":"你毋通睏甲遐「晏」。"},{"value":"B","text":"加「倩」兩个人來鬥跤手。"},{"value":"C","text":"你莫「戇」矣！"},{"value":"D","text":"遮的花愛「沃」水。"}],"answer":"C"},{"id":208,"number":"208","category":"語詞語法","question":"臺灣歌仔戲的發展中，表演者走到人群聚集的廣場，群眾在廣場上圍成圈圈，形成一個表演空間，演出者就在中間臨時圍成一個四方形的場子，這種沒有舞臺的演出型態稱為？","options":[{"value":"A","text":"落地掃"},{"value":"B","text":"梨園戲"},{"value":"C","text":"高甲戲"},{"value":"D","text":"傀儡戲"}],"answer":"A"},{"id":209,"number":"209","category":"語詞語法","question":"以下佗一个選項內底的俗諺意思是「事與願違」？","options":[{"value":"A","text":"田螺含水過冬。"},{"value":"B","text":"三講，四毋著。"},{"value":"C","text":"瘦田𠢕欶水。"},{"value":"D","text":"豬毋大，大對狗去。"}],"answer":"D"},{"id":210,"number":"210","category":"語詞語法","question":"共「紅菜」佮「翁婿」講做同音詞，是佗位腔調的特色？","options":[{"value":"A","text":"萬巒"},{"value":"B","text":"關廟"},{"value":"C","text":"宜蘭"},{"value":"D","text":"鹿港"}],"answer":"B"},{"id":211,"number":"211","category":"語詞語法","question":"「楊家正月有佮王哥去何姊仔遐拜託伊後日參逐家做伙共柚仔食一半粒仔，敢毋是按呢？」這一句的輕聲字如果以前後關係排列，下列四組各若干個字（音節），哪一組的輕聲標示無誤？","options":[{"value":"A","text":"月、哥、一、半、粒、仔"},{"value":"B","text":"家、月、哥、仔、日、一、半、粒、仔"},{"value":"C","text":"家、月、仔、日、仔、半、粒、仔、是"},{"value":"D","text":"家、月、哥、仔、日、一、半、粒、仔、是、按、呢"}],"answer":"B"},{"id":212,"number":"212","category":"語詞語法","question":"指正學生臺灣閩南語的語言錯誤，不免要對語詞、語句加以說明，使其獲得判斷能力。因此，你對於「惡馬惡人騎」這一句話的教導，認為何種解說最佳？","options":[{"value":"A","text":"想要制服凶險的事物，需要練就凶險的手段。"},{"value":"B","text":"制服凶險的事物，需要具有凶險手段的人，一般人不宜自不量力。"},{"value":"C","text":"這句「惡馬惡人騎」的後面還有接續的一句：「桃花馬去拄著關老爺」，意思是最厲害的是關公——關老爺。"},{"value":"D","text":"不要以為自己厲害，再厲害都有更厲害的人來制服你。"}],"answer":"D"},{"id":213,"number":"213","category":"語詞語法","question":"進食的「動作」，臺灣閩南語不說不寫為「吃」，而要說並寫為「食」。如果學生問為什麼？教師應該如何回答？下面四組回答的話語，哪一個比較好？","options":[{"value":"A","text":"通常學生只要簡單的答案，不會要求解說，因此應該說教育部《臺灣閩南語常用詞辭典》規定的。"},{"value":"B","text":"國語寫的「吃」，看起來像乞丐的嘴巴，因此寫為「食」比較好。"},{"value":"C","text":"「食」是本字，字的上一部分表示人嘴，下一部分是裝著食物的食具，同時讀音也是漢字古來所傳。"},{"value":"D","text":"「食」是古字，有「餵」的意思，本為動詞。而「吃」字來源於「口吃」義。"}],"answer":"C"},{"id":214,"number":"214","category":"語詞語法","question":"「軟塗深掘」這句俗語的語言結構，和下列諸語何者最為相近？","options":[{"value":"A","text":"孤鳥單飛"},{"value":"B","text":"孤鳥入群"},{"value":"C","text":"惡人心虛"},{"value":"D","text":"大船深港"}],"answer":"A"},{"id":215,"number":"215","category":"語詞語法","question":"「文化中心歡迎天然劇團遠路來訪」這一句話中的「迎」、「然」兩字都是陽平調，而兩字的聲母和韻母，採用教育部公布的臺灣羅馬字音標，應該標注為？","options":[{"value":"A","text":"ing、len"},{"value":"B","text":"ging、jian"},{"value":"C","text":"geng、jien"},{"value":"D","text":"ing、lien"}],"answer":"B"},{"id":216,"number":"216","category":"語詞語法","question":"金門人講的「kam-á-te」，是佗一款果子？","options":[{"value":"A","text":"kiat-á"},{"value":"B","text":"phû-tô-iū"},{"value":"C","text":"thoo-má-tooh"},{"value":"D","text":"nâi-á-pu̍t"}],"answer":"C"},{"id":217,"number":"217","category":"語詞語法","question":"「甲：________？」 「乙：我無想欲去。」 後壁佗一句無可能是甲講的話？","options":[{"value":"A","text":"你無想欲去無？"},{"value":"B","text":"你敢無想欲去？"},{"value":"C","text":"你有想欲去 honnh？"},{"value":"D","text":"你有想欲去無？"}],"answer":"A"},{"id":218,"number":"218","category":"語詞語法","question":"後面佗一句咱較會按呢講？","options":[{"value":"A","text":"你看彼粒山，伊有夠懸呢。"},{"value":"B","text":"你 bē-sái 用彼塊甌仔，我等咧欲用伊啉茶。"},{"value":"C","text":"阮兜彼箍乎，伊自頂禮拜就無出去過。"},{"value":"D","text":"阮小弟小妹兩个人伊已經到烈嶼矣。"}],"answer":"C"},{"id":219,"number":"219","category":"語詞語法","question":"後壁佗一句的「按怎」意思佮用法和別个選項上蓋無仝？","options":[{"value":"A","text":"你明仔載欲按怎去金城？"},{"value":"B","text":"你有收著阿南的批是毋？伊批內底寫按怎？"},{"value":"C","text":"門歹去矣，我毋知影按怎才修理會好。"},{"value":"D","text":"請你共我講按怎才會當做國中的老師。"}],"answer":"B"},{"id":220,"number":"220","category":"語詞語法","question":"後壁佗一句話無合語法？","options":[{"value":"A","text":"生份人叫伊匯錢，伊就欲去匯，恁阿妙仔閣咧戇矣。"},{"value":"B","text":"阿妙仔這站仔人咧艱苦，咱莫去共攪擾。"},{"value":"C","text":"我這幾工都咧較袂拄好，想欲共你壘一萬箍仔。"},{"value":"D","text":"窗仔咧破的時，毋好傷倚，會去割著。"}],"answer":"D"},{"id":221,"number":"221","category":"語詞語法","question":"後面佗一句無合咱的話的語法？","options":[{"value":"A","text":"阿明較懸阿忠。"},{"value":"B","text":"阿明比阿忠較懸。"},{"value":"C","text":"阿明較懸過阿忠。"},{"value":"D","text":"四句攏有合語法。"}],"answer":"D"},{"id":222,"number":"222","category":"語詞語法","question":"俗諺「做徛山頭家」，意思佮後壁佗一个選項相仝？","options":[{"value":"A","text":"予人扛去顧山。"},{"value":"B","text":"徛旗仔佔山造反。"},{"value":"C","text":"徛懸山看馬相踢。"},{"value":"D","text":"田園厝地真闊。"}],"answer":"C"},{"id":223,"number":"223","category":"語詞語法","question":"「這堵壁足_____，用戮鑽閣鑽袂過。」佗一个選項添入去上適當？","options":[{"value":"A","text":"𠕇"},{"value":"B","text":"硬"},{"value":"C","text":"洘"},{"value":"D","text":"實"}],"answer":"A"},{"id":224,"number":"224","category":"語詞語法","question":"「老爸佇厝煮暗頓，老母_____ 幼囝出去外口散步。」佗一个選項添入去上適當？","options":[{"value":"A","text":"揹"},{"value":"B","text":"背"},{"value":"C","text":"偝"},{"value":"D","text":"挔"}],"answer":"C"},{"id":225,"number":"225","category":"語詞語法","question":"「我目睭坱著風飛沙，你敢會當共我_______咧？」佗一个選項添入去上適當？","options":[{"value":"A","text":"吹吹"},{"value":"B","text":"歕歕"},{"value":"C","text":"搧搧"},{"value":"D","text":"拊拊"}],"answer":"B"},{"id":226,"number":"226","category":"語詞語法","question":"「做期貨______規褲底，人踅神踅神，駛車去共人挵著，閣愛_____人一條錢。」佗一組選項添入去上適當？","options":[{"value":"A","text":"賠 / 賠"},{"value":"B","text":"了 / 賠"},{"value":"C","text":"失 / 了"},{"value":"D","text":"了 / 了。"}],"answer":"B"},{"id":227,"number":"227","category":"語詞語法","question":"「______公司的董事長上愛講：這是_____公司，我會負責做上尾的決定。」佗一組 選項添入去上適當？"," 橐袋仔無夠深的，定定會_______ 。」請問空格仔內上適當的俗諺是佗一句？","options":[{"value":"A","text":"Jîn-tsîng-sè-sū puê kàu-kàu, bô tiánn koh bô tsàu."},{"value":"B","text":"Ji̍p lâng mn̂g, sūn lâng ì."},{"value":"C","text":"Jîn-tsîng lâu tsi̍t suànn, ji̍t-āu hó sio-khuànn."},{"value":"D","text":"Lâng khan m̄ kiânn, kuí khan liù-liù-kiânn.。"}],"answer":"A"},{"id":312,"number":"312","category":"語詞語法","question":"(1)「花」蓮／沃「花」 (2) 心「聲」／尾「聲」 (3) 蜜「月」／「月」娘(4) 蠓仔「香」／五「香」 (5) 「迎」接／「迎」鬧熱 (6) 「面」皮／「面」會 (7) 「後」果／「後」悔 (8) 現「今」／「今」仔日 頂面這八組內底有幾組「 」內的字閩南語發音是仝款？","options":[{"value":"A","text":"1"},{"value":"B","text":"2"},{"value":"C","text":"3"},{"value":"D","text":"5"}],"answer":"B"},{"id":313,"number":"313","category":"語詞語法","question":"下底的諺語佗一个意思有重耽？","options":[{"value":"A","text":"食著藥，青草一葉；食毋著藥，人參一石—對症下藥"},{"value":"B","text":"一日走拋拋，一暝點燈膋—本末倒置"},{"value":"C","text":"心歹無人知，喙歹上厲害 —口蜜腹劍"},{"value":"D","text":"九月颱，無人知—天有不測風雲。"}],"answer":"C"},{"id":314,"number":"314","category":"語詞語法","question":"請問下底的骨頭名稱佗一个毋是佇咱人的頂身？","options":[{"value":"A","text":"箅仔骨"},{"value":"B","text":"飯匙骨"},{"value":"C","text":"胸坎骨"},{"value":"D","text":"跤頭腕"}],"answer":"D"},{"id":315,"number":"315","category":"語詞語法","question":"「語言」與「文化」關係十分密切，教學上也應相互搭配。臺灣民間有所謂的「做牙」的傳統，請問「尾牙」是指農曆的哪一天？","options":[{"value":"A","text":"正月初二"},{"value":"B","text":"正月十六"},{"value":"C","text":"十二月初二"},{"value":"D","text":"十二月十六"}],"answer":"D"},{"id":316,"number":"316","category":"語詞語法","question":"句式的教學應依難易度或結構複雜度的不同而加以分級，這三個給予句「a.佇遮講故事予逐家聽」、「b. 坐予正才會得人疼」、「c. 老師予阮小妹一本冊」，若從初級到高級依序排列，下列哪一個順序較為合適？","options":[{"value":"A","text":"abc"},{"value":"B","text":"bac"},{"value":"C","text":"cab"},{"value":"D","text":"cba"}],"answer":"C"},{"id":317,"number":"317","category":"語詞語法","question":"「烏雲罩月伊找無天邊也那粒星」(鳥兒在飛 歌詞)這句中出現多少個不是教育部規範的標準用字？","options":[{"value":"A","text":"1"},{"value":"B","text":"2"},{"value":"C","text":"3"},{"value":"D","text":"4"}],"answer":"C"},{"id":318,"number":"318","category":"語詞語法","question":"臺灣閩南語中姊妹的丈夫彼此互稱為？","options":[{"value":"A","text":"姨表的"},{"value":"B","text":"叔伯的"},{"value":"C","text":"祧仔內"},{"value":"D","text":"大細腎"}],"answer":"D"},{"id":319,"number":"319","category":"語詞語法","question":"閩南語常有一字多音的現象，下列哪一個「落」的臺羅拼音是正確的？","options":[{"value":"A","text":"落杓lak-sia̍ h"},{"value":"B","text":"落臉lak-lián"},{"value":"C","text":"落湳làu –làm"},{"value":"D","text":"落色làu-sik"}],"answer":"B"},{"id":320,"number":"320","category":"語詞語法","question":"哪一選項中的臺灣閩南語俗諺，何者可用來表達浪費人力？","options":[{"value":"A","text":"一个剃頭，一个扳耳"},{"value":"B","text":"一个童乩，一个桌頭"},{"value":"C","text":"一人看出一家"},{"value":"D","text":"一肢手掩一家喙"}],"answer":"A"},{"id":321,"number":"321","category":"語詞語法","question":"臺灣閩南語內部的次方言主要有漳州腔和泉州腔兩種，以下何者讀音不屬於漳州腔？","options":[{"value":"A","text":"街ke"},{"value":"B","text":"豬ti"},{"value":"C","text":"斤kun"},{"value":"D","text":"張tionn"}],"answer":"C"},{"id":322,"number":"322","category":"語詞語法","question":"依臺羅標音正式版，下列選項之標音何者有誤？","options":[{"value":"A","text":"紅膏赤蠘(âng-ko-tshiah-tshi̍h)"},{"value":"B","text":"無攬無拈(bô-lám-bô-ne)"},{"value":"C","text":"挽瓜揫藤(bán-kue-tshiû-tîn)"},{"value":"D","text":"美國仙丹(bí-kok-sian-tan)"}],"answer":"D"},{"id":323,"number":"323","category":"語詞語法","question":"「風吹」是主謂式複合詞，下列何者結構與之相同？","options":[{"value":"A","text":"親家"},{"value":"B","text":"米芳"},{"value":"C","text":"災厄"},{"value":"D","text":"偷提"}],"answer":"B"},{"id":324,"number":"329","category":"語詞語法","question":"選項「」內底的漢字，佗一組的韻母仝款？","options":[{"value":"A","text":"叫毋「敢」／不「敢」當"},{"value":"B","text":"芡「芳」／「芳」名"},{"value":"C","text":"奇「數」／腳「數」"},{"value":"D","text":"扁「擔」／麵「擔」仔"}],"answer":"D"},{"id":325,"number":"330","category":"語詞語法","question":"選項「」內底漢字的韻母，佗一个有「入聲韻尾」？","options":[{"value":"A","text":"虼「蚻」"},{"value":"B","text":"「夯」枷"},{"value":"C","text":"「提」煉"},{"value":"D","text":"「炤」路"}],"answer":"A"},{"id":326,"number":"331","category":"語詞語法","question":"真濟語詞佇口語的時陣，會有連讀變化，親像「新婦」讀做 sim-pū，就是一種音變，下面佗一个詞的音變佮「新婦」 仝類型？","options":[{"value":"A","text":"艱苦 kang-khóo"},{"value":"B","text":"柑仔 kam-má"},{"value":"C","text":"昨昏 ":"這期 ê 學生有減 tām-po̍h-á"},{"value":"C","text":"這期 ê 學生減 tsiok tsē"},{"value":"D","text":"這期 ê 學生加 tsiok tsē"}],"answer":"C"},{"id":442,"number":"452","category":"語詞語法","question":"俗語講：「做雞著筅，做人著反」，這句話內底的「反」佮下面佗一个的「反」意思無仝款？","options":[{"value":"A","text":"反腹"},{"value":"B","text":"反正"},{"value":"C","text":"反車"},{"value":"D","text":"反爿"}],"answer":"B"},{"id":443,"number":"453","category":"語詞語法","question":"「今囡仔生＿＿生囉！無，你敢欲閣共伊櫼轉去！」請問空格仔內添佗一字上適當？","options":[{"value":"A","text":"攏"},{"value":"B","text":"就"},{"value":"C","text":"都"},{"value":"D","text":"著"}],"answer":"C"},{"id":444,"number":"454","category":"語詞語法","question":"下底佗一句話是照咱的話在來的語法？","options":[{"value":"A","text":"我的慣勢是按呢"},{"value":"B","text":"攏總開了三十外萬"},{"value":"C","text":"相片予我分張一下"},{"value":"D","text":"我的筆較好你的筆"}],"answer":"D"},{"id":445,"number":"455","category":"語詞語法","question":"「我人無啥爽快，物件較食都袂＿＿＿。」空格仔內應該愛揀佗一項選項？","options":[{"value":"A","text":"ha̍h-tshuì"},{"value":"B","text":"tuì-tshuì"},{"value":"C","text":"uì-tshuì"},{"value":"D","text":"tsiap-tshuì"}],"answer":"A"},{"id":446,"number":"456","category":"語詞語法","question":"阿芳查某囝號做阿玲，阿玲叫阿勝阿舅，阿芬是阿勝的查某囝，按呢阿玲是阿芬的啥物關係？","options":[{"value":"A","text":"姑表"},{"value":"B","text":"姨表"},{"value":"C","text":"叔伯"},{"value":"D","text":"妗表"}],"answer":"A"},{"id":447,"number":"457","category":"語詞語法","question":"「Kin-á-ji̍t sī Gōo-ge̍h-tsueh, A-sûn tsn̂g tso̍h--ji̍t tiō kā tsàng pa̍k hó-sè--looh!」Tshiánn-mn̄g A-sûn sī kū-li̍k Gōo-ge̍h tshue kuí kā tsàng pa̍k hó-sè--ê?","options":[{"value":"A","text":"it"},{"value":"B","text":"jī"},{"value":"C","text":"sann"},{"value":"D","text":"sì"}],"answer":"C"},{"id":448,"number":"458","category":"語詞語法","question":"下底的文章內容主題是講啥物？ Hit tiâu an-tsuân-bō-tuà kóng tînn leh ku-khak tíng-kuân--lah! Án-ne ná ū-thong? hit tsiah hái-ku nā-sī lóng bô-huat-tōo bī-lo̍h-khì tsuí-té, i beh án-tsuánn tsia̍h mi̍h-kiānn? Beh án-tsuánn hioh-khùn? Sî-kan nā thua kú, lú tînn lú ân lú pháinn tháu, he tō sí-lōo tsi̍t tiâu.","options":[{"value":"A","tex xt":"猶"},{"value":"B","text":"也"},{"value":"C","text":"抑"},{"value":"D","text":"曷"}],"answer":"C"},{"id":513,"number":"525","category":"語詞語法","question":"請問下面佗一種雨是有日頭的落雨？","options":[{"value":"A","text":"𤺪雨"},{"value":"B","text":"黃酸雨"},{"value":"C","text":"查某雨"},{"value":"D","text":"芒種雨"}],"answer":"C"},{"id":514,"number":"526","category":"語詞語法","question":"請問下面「頭」的用法，佗一个佮其他三个無仝？","options":[{"value":"A","text":"樹頭"},{"value":"B","text":"骨頭"},{"value":"C","text":"興頭"},{"value":"D","text":"日頭"}],"answer":"A"},{"id":515,"number":"527","category":"語詞語法","question":"Tshiánn-mn̄ g ē-bīn toh tsi̍t ê suán-hāng siōng ha̍ p Tâi-gí ê gí-huat？","options":[{"value":"A","text":"飯食煞就緊去歇睏。"},{"value":"B","text":"啉完酒就毋知人。"},{"value":"C","text":"伊畫的大石頭上成？"},{"value":"D","text":"彼敢毋是我的筆嗎？"}],"answer":"A"},{"id":516,"number":"528","category":"語詞語法","question":"請問下面台語量詞的用法，佗一个無正確？","options":[{"value":"A","text":"一「副」碗箸"},{"value":"B","text":"一「港」風"},{"value":"C","text":"一「坎」店"},{"value":"D","text":"一「支」薰"}],"answer":"D"},{"id":517,"number":"529","category":"語詞語法","question":"「功課濟甲若____ 」意思是功課足濟，做袂了的意思。請問空格仔內底囥佗一个詞上適合？","options":[{"value":"A","text":"狗仔毛"},{"value":"B","text":"貓仔毛"},{"value":"C","text":"兔仔毛"},{"value":"D","text":"鳥仔毛"}],"answer":"B"},{"id":518,"number":"530","category":"語詞語法","question":"請問「貓神」和下面佗一个選項的意思上接近？","options":[{"value":"A","text":"𡳞神"},{"value":"B","text":"拗蠻"},{"value":"C","text":"交繃"},{"value":"D","text":"牛螕"}],"answer":"C"},{"id":519,"number":"531","category":"語詞語法","question":"請問下面佗一句話內底的「著」無符合台語的語法使用？","options":[{"value":"A","text":"門口掛著一張紅色的紙"},{"value":"B","text":"兄弟姊妹著互相體諒"},{"value":"C","text":"驚驚袂著等"},{"value":"D","text":"你穿這軀洋裝看著誠媠"}],"answer":"A"},{"id":520,"number":"532","category":"語詞語法","question":"「三叔佇外口做生理，定定著去佮客戶接接(tsih-tsiap)。」請問這句話的 「接接」會用得會用得換做下底佗一个","options":[{"value":"A","text":"接人"},{"value":"B","text":"接頭"},{"value":"C","text":"接跤"},{"value":"D","text":"接客"}],"answer":"B"},{"id":521,"number":"533","category":"語詞語法","question":"「阮母 xt":"六個月"}],"answer":"A"},{"id":530,"number":"542","category":"語詞語法","question":"下底佗一句俗諺是咧講「這个人傷貪，逐項攏欲」？","options":[{"value":"A","text":"目睭看懸，無看低。"},{"value":"B","text":"目睭金金人傷重。"},{"value":"C","text":"目睭掛斗概，看人物就愛。"},{"value":"D","text":"目睭看佇粿，跤踏著火"}],"answer":"C"},{"id":531,"number":"543","category":"語詞語法","question":"這過的地動誠大，予足濟人著青驚，咱愛提早預防。請問「著青驚」會當用下面佗一个語詞來形容？","options":[{"value":"A","text":"𪁎趒"},{"value":"B","text":"跳童"},{"value":"C","text":"嚓嚓趒"},{"value":"D","text":"掣一趒"}],"answer":"D"},{"id":532,"number":"544","category":"語詞語法","question":"揀出漢字攏用教育部建議推薦用字的選項：","options":[{"value":"A","text":"伊差一點仔就著獎矣，有夠無采"},{"value":"B","text":"伊干焦靠淡薄仔薪水咧罔度爾爾"},{"value":"C","text":"伊是糾儉的人，毋甘開錢享受"},{"value":"D","text":"坐傷久腰脊骨會酸，上無嘛半點鐘就起來伸輪一下"}],"answer":"B"},{"id":533,"number":"545","category":"語詞語法","question":"Tó tsi̍t ê gú-sû ê ì-sù sī leh kā lâng o-ló？","options":[{"value":"A","text":"tshiò-bīn-hóo"},{"value":"B","text":"put-tap-put-tshit"},{"value":"C","text":"khiáu-sîn"},{"value":"D","text":"pat-tin"}],"answer":"C"},{"id":534,"number":"546","category":"語詞語法","question":"揀出語法、用詞上合台語 khùi-kháu 的語句：","options":[{"value":"A","text":"伊跤手真緊，穡頭一睏仔就做了矣"},{"value":"B","text":"伊頷頸掛著一條真大條的金袚鍊"},{"value":"C","text":"這件代誌若是傳出去的話，會真歹聽"},{"value":"D","text":"阿母留了一張字條仔予我，吩咐講愛會記得去納電火錢"}],"answer":"A"},{"id":535,"number":"547","category":"語詞語法","question":"關係賴黃鴛女士唸唱的歌：「阿君趁食落滬尾，我娘煩惱頭無梳，等待阿君若轉回，梳頭抹粉插芳花。」揀出毋著的選項：","options":[{"value":"A","text":"這是一條台語 po-kua，逐句攏押韻"},{"value":"B","text":"「滬尾」的「滬」佮「忠厚老實」的「厚」仝音"},{"value":"C","text":"「我娘煩惱頭無梳」是因為「為君掛吊」"},{"value":"D","text":"「梳頭抹粉插芳花」是咧講阿君轉來的時，會買胭脂水粉送阿娘"}],"answer":"D"},{"id":536,"number":"548","category":"語詞語法","question":"佗一个選項 ê 俗語，意思 tsham「捷罵袂聽，捷拍袂疼」khah sio-uá？","options":[{"value":"A","text":"Tsa̍p-liām ta-ke tshut bân-phuê sin-pū."},{"value":"B","text":"Ang tshin bóo tshin, lāu-pô-á pha-tshia-lin."},{"value":"C","text":"Bô bí ū tsing-khū, bô kiánn phō sin-pū."},{"value":"D","text":"Lāu-lâng m̄ kóng-kóo, siàu-liân m̄ bat pó."}],"answer":"A"},{"id":537,"number":"549","category":"語詞語法","question":"「欲掠田嬰真簡單，一支指頭仔佇頭前踅，另外一支手對後壁共 就會使矣。」請問，空格內面填佗一个選項上適合？","options":[{"value":"A","text":"拈（ni）"},{"value":"B","text":"拈（liam）"},{"value":"C","text":"捻（liàm）"},{"value":"D","text":"捏（tēnn）"}],"answer":"B"},{"id":538,"number":"550","category":"語詞語法","question":"「阿母，老師講我真熱心，閣叫我做班長呢！」 「是啊，煞毋知影你平常時就上家婆性矣，想袂到這遍去予你趁著。」根據對話，阿母的話，主要欲表達的意思是啥物？","options":[{"value":"A","text":"毋知影老師是按怎欲選囡仔做班長"},{"value":"B","text":"感覺囡仔傷過家婆毋好"},{"value":"C","text":"認為老師選囡仔做班長無真適合"},{"value":"D","text":"對囡仔予人選做班長感覺歡喜"}],"answer":"D"},{"id":539,"number":"551","category":"語詞語法","question":"請問下面佗一个選項的「較」無「相比較」的意思？","options":[{"value":"A","text":"行較緊咧"},{"value":"B","text":"較教都袂曉"},{"value":"C","text":"最近有較衰"},{"value":"D","text":"厝有較細間一寡"}],"answer":"B"},{"id":540,"number":"552","category":"語詞語法","question":"請問下面佗一个選項毋是民間對臺灣五、六月仔雨季連續落的雨的稱呼？","options":[{"value":"A","text":"放雨白"},{"value":"B","text":"黃酸雨"},{"value":"C","text":"芒種雨"},{"value":"D","text":"𤺪雨"}],"answer":"A"},{"id":541,"number":"553","category":"語詞語法","question":"「校門對面的竹仔生甲真大 ，已經造成學生出入的困擾。」請問，空格內面填下面佗一个詞上適合？","options":[{"value":"A","text":"囷"},{"value":"B","text":"欉"},{"value":"C","text":"枝"},{"value":"D","text":"部"}],"answer":"D"},{"id":542,"number":"554","category":"語詞語法","question":"「你炒的這盤菜怎有一種 的味？無好食！」請問，空格內面上適合填下面佗一个詞？","options":[{"value":"A","text":"臭殕"},{"value":"B","text":"臭香"},{"value":"C","text":"臭腥"},{"value":"D","text":"臭羶"}],"answer":"C"},{"id":543,"number":"555","category":"語詞語法","question":"「這物件著愛 500 箍 ！」請問空格內面填入下面佗一个選項上適當？","options":[{"value":"A","text":"niā"},{"value":"B","text":"lioh"},{"value":"C","text":"tsiànn-tsiànn"},{"value":"D","text":"tō-hó"}],"answer":"B"},{"id":544,"number":"556","category":"語詞語法","question":". 「阿明哪會遮呢𠢕，細細漢仔就會曉這？」 「啊都 meh!」 請問，空格內面填佗一句俗語上適當？","options":[{"value":"A","text":"豬頭皮炸無油"},{"value":"B","text":"豬頭毋顧，顧鴨母卵"},{"value":"C","text":"豬母牽去牛墟"},{"value":"D","text":"曲館邊的豬母會拍拍"}],"answer":"D"},{"id":545,"number":"557","category":"語詞語法","question":". 甲：「爸，我先來轉。」「好啊，轉去的時，才開較緊咧 heh!」 乙：「爸，我欲袂赴矣，開較緊咧敢好？」 請問，頂面二段對話內面的「開較緊咧」，實際上是代表啥物意思？","options":[{"value":"A","text":"甲、乙攏是開較緊咧"},{"value":"B","text":"甲、乙攏是開較慢咧"},{"value":"C","text":"甲是開較緊咧；乙是開較慢咧"},{"value":"D","text":"甲是開較慢咧；乙是開較緊咧"}],"answer":"D"}];
const categorySelect=document.getElementById('categorySelect'),countSelect=document.getElementById('countSelect'),questionText=document.getElementById('questionText'),optionsBox=document.getElementById('options'),feedback=document.getElementById('feedback'),progress=document.getElementById('progress'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
let run=[],idx=0,answered={};
[...new Set(QUESTIONS.map(q=>q.category))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;categorySelect.appendChild(o)});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let pool=QUESTIONS;if(categorySelect.value!=='all')pool=pool.filter(q=>q.category===categorySelect.value);pool=shuffle([...pool]);const n=countSelect.value==='all'?pool.length:Number(countSelect.value);run=pool.slice(0,n);idx=0;answered={};render()}
function render(){if(!run.length){questionText.textContent='這個類別目前沒有可練習的題目。';optionsBox.innerHTML='';return}const q=run[idx];progress.textContent=`第 ${idx+1} / ${run.length} 題・${q.category}・原題第 ${q.number} 題`;questionText.textContent=q.question||'（題幹文字需要人工確認）';optionsBox.innerHTML='';feedback.classList.add('hidden');feedback.innerHTML='';const chosen=answered[idx];q.options.forEach(o=>{const b=document.createElement('button');b.className='option';const l=document.createElement('span');l.className='letter';l.textContent=o.value;const t=document.createElement('span');t.textContent=o.text;b.append(l,t);b.disabled=chosen!==undefined;if(chosen!==undefined){if(o.value===q.answer)b.classList.add('correct');else if(o.value===chosen)b.classList.add('wrong')}b.addEventListener('click',()=>{answered[idx]=o.value;render()});optionsBox.appendChild(b)});if(chosen!==undefined){feedback.classList.remove('hidden');feedback.innerHTML=chosen===q.answer?'<strong>【著矣!】</strong>':`<strong>【正確答案是: ${q.answer}】</strong>`}prevBtn.disabled=idx===0;nextBtn.disabled=chosen===undefined;nextBtn.textContent=idx===run.length-1?'完成本回':'下一題'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
prevBtn.addEventListener('click',()=>{if(idx>0){idx--;render()}});nextBtn.addEventListener('click',()=>{if(idx<run.length-1){idx++;render()}else{questionText.textContent=`本回完成！你已作答 ${Object.keys(answered).length} 題。`;optionsBox.innerHTML='';feedback.classList.add('hidden');progress.textContent='練習完成';prevBtn.disabled=true;nextBtn.disabled=true;nextBtn.textContent='下一題'}});document.getElementById('startBtn').addEventListener('click',start);start();
</script></body></html>
