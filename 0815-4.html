<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tâi-oân Sió-chia̍h Slot Machine - 台灣小吃拉霸機</title>
    <!-- Google Font: Iansui (芫荽) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Iansui&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: 'Iansui', 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-iansui {
            font-family: 'Iansui', serif;
        }

        /* Neon Glow Effects */
        .neon-text-red {
            text-shadow: 0 0 5px #ff2a6d, 0 0 10px #ff2a6d, 0 0 20px #ff2a6d, 0 0 40px #ff0055;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffb703, 0 0 10px #ffb703, 0 0 20px #fb8500;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.6), inset 0 0 15px rgba(255, 183, 3, 0.4);
        }

        /* Marquee Bulbs */
        .bulb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #444;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        @media (min-width: 640px) {
            .bulb {
                width: 12px;
                height: 12px;
            }
        }
        .bulb.active-1 {
            background-color: #ff2a6d;
            box-shadow: 0 0 8px #ff2a6d, 0 0 16px #ff2a6d;
        }
        .bulb.active-2 {
            background-color: #ffb703;
            box-shadow: 0 0 8px #ffb703, 0 0 16px #ffb703;
        }
        .bulb.active-3 {
            background-color: #05d9e8;
            box-shadow: 0 0 8px #05d9e8, 0 0 16px #05d9e8;
        }

        /* 3D Machine Effect */
        .slot-machine-body {
            background: linear-gradient(145deg, #1f293d, #111827);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 0 3px #374151, inset 0 2px 3px rgba(255,255,255,0.2);
        }

        /* Reel Window styling */
        .reel-window {
            background: linear-gradient(to bottom, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.9), inset 0 -8px 16px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
            border: 3px solid #d97706;
        }

        /* Glass reflection overlay */
        .glass-overlay {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 40%, rgba(0,0,0,0) 41%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }

        /* Physical Lever Styling */
        .lever-arm {
            transform-origin: bottom center;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lever-pulled .lever-arm {
            transform: rotateX(65deg) scaleY(0.7);
        }
        .lever-ball {
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.6), 0 0 12px rgba(239, 68, 68, 0.8);
            transition: transform 0.15s;
        }
        .lever-pulled .lever-ball {
            transform: translateY(80px) scale(0.9);
        }

        /* Motion blur during fast reel rotation */
        .blur-motion {
            filter: blur(4px);
        }

        /* Background grid pattern */
        .bg-pattern {
            background-color: #0d1117;
            background-image: radial-gradient(#1f293d 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-pattern h-screen h-[100dvh] text-slate-100 flex flex-col justify-between overflow-hidden relative">

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <!-- Top Header Bar with ~1cm top padding -->
    <header class="w-full bg-slate-900/90 backdrop-blur border-b border-slate-800 pt-4 pb-2 px-3 md:px-6 flex justify-between items-center z-20 flex-shrink-0">
        <div class="flex items-center gap-1.5 md:gap-2">
            <span class="text-xl md:text-2xl">🇹🇼</span>
            <h1 class="text-lg md:text-2xl font-bold tracking-wide text-amber-400 font-iansui">
                Siōng好食ê台灣美食
            </h1>
        </div>
        
        <!-- Utility buttons -->
        <div class="flex items-center gap-1.5 md:gap-2" onclick="event.stopPropagation()">
            <button id="bgmToggleBtn" class="p-1.5 md:p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 transition flex items-center gap-1" title="背景音樂">
                <i class="fas fa-music text-base md:text-lg" id="bgmIcon"></i>
            </button>
            <button id="soundToggleBtn" class="p-1.5 md:p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 transition" title="音效切換">
                <i class="fas fa-volume-up text-base md:text-lg"></i>
            </button>
            <button id="menuBtn" class="p-1.5 px-2.5 md:p-2 md:px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs md:text-sm font-iansui transition flex items-center gap-1">
                <i class="fas fa-utensils text-amber-400"></i>
                <span>菜單</span>
            </button>
            <button id="historyBtn" class="p-1.5 px-2.5 md:p-2 md:px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs md:text-sm font-iansui transition flex items-center gap-1">
                <i class="fas fa-history text-cyan-400"></i>
                <span>紀錄</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area (Click anywhere triggers spin) -->
    <main id="clickAnywhereArea" class="flex-1 flex flex-col items-center justify-center p-2 sm:p-4 md:p-6 relative cursor-pointer select-none min-h-0">
        
        <!-- Slot Machine Assembly (Expanded horizontally with ~2cm side padding) -->
        <div class="relative flex items-center justify-center w-[calc(100%-2rem)] max-w-3xl my-auto">
            
            <!-- Machine Body -->
            <div class="slot-machine-body w-full rounded-2xl p-3 sm:p-5 md:p-6 border-2 border-amber-500/30 relative z-10 flex flex-col items-center shadow-2xl">
                
                <!-- Marquee Header with Bulbs -->
                <div class="w-full bg-slate-950 rounded-xl p-2 md:p-3 mb-2 md:mb-4 border border-amber-500/40 flex flex-col items-center relative overflow-hidden">
                    <!-- Top Bulbs Row -->
                    <div class="w-full flex justify-between px-2 mb-1" id="topBulbs">
                        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
                        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
                        <div class="bulb"></div>
                    </div>

                    <!-- Main Marquee Title -->
                    <div class="text-center py-0.5">
                        <div class="text-xs md:text-sm uppercase tracking-widest text-amber-500 font-bold">LÂ-BA-KIÁⁿ</div>
                        <div class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-amber-400 font-iansui tracking-wider neon-text-yellow leading-tight">
                            Siōng好食ê台灣美食
                        </div>
                    </div>

                    <!-- Bottom Bulbs Row -->
                    <div class="w-full flex justify-between px-2 mt-1" id="bottomBulbs">
                        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
                        <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
                        <div class="bulb"></div>
                    </div>
                </div>

                <!-- Single Reel Slot Window (Shows strictly 1 centered item) -->
                <div class="w-full relative my-1">
                    <!-- Reel Frame: Fixed height matching item height so adjacent items are hidden -->
                    <div id="reelWindow" class="reel-window rounded-xl h-28 sm:h-36 md:h-44 w-full overflow-hidden relative">
                        
                        <!-- Center Highlight Pointer Indicators -->
                        <div class="absolute inset-x-0 h-full border-y-2 border-amber-400/80 bg-amber-400/5 z-20 pointer-events-none flex justify-between items-center px-2">
                            <div class="text-amber-400 text-lg sm:text-2xl md:text-3xl"><i class="fas fa-caret-right"></i></div>
                            <div class="text-amber-400 text-lg sm:text-2xl md:text-3xl"><i class="fas fa-caret-left"></i></div>
                        </div>

                        <!-- Glass Gloss Overlay -->
                        <div class="glass-overlay absolute inset-0 z-30"></div>

                        <!-- Animated Reel Inner Container -->
                        <div id="reelContainer" class="w-full absolute top-0 left-0 flex flex-col items-center transition-transform">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- 3D Physical Side Lever Assembly -->
            <div id="leverAssembly" class="relative z-0 hidden sm:block -ml-3 h-48 w-10 cursor-pointer" title="點擊拉桿拉霸">
                <!-- Lever Base Box attached to machine -->
                <div class="absolute bottom-3 left-0 w-6 h-12 bg-gradient-to-r from-slate-700 to-slate-900 rounded-r-lg border-y border-r border-slate-600 shadow-xl"></div>
                
                <!-- Pivot Mechanism -->
                <div class="absolute bottom-6 left-1.5 w-5 h-6 bg-slate-500 rounded-r-full shadow-inner border border-slate-400"></div>

                <!-- Rotating Metallic Rod -->
                <div id="leverArm" class="lever-arm absolute bottom-8 left-2.5 w-2.5 h-32 bg-gradient-to-r from-slate-300 via-slate-100 to-slate-400 rounded-t-full shadow-md origin-bottom">
                    <!-- Red Ball Knob at Top -->
                    <div id="leverBall" class="lever-ball absolute -top-5 -left-2.5 w-7 h-7 bg-gradient-to-tr from-red-700 via-red-500 to-rose-300 rounded-full border border-red-400"></div>
                </div>
            </div>

        </div>

    </main>

    <!-- Modal 1: 10 Foods List Modal -->
    <div id="menuModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="event.stopPropagation()">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="text-base font-bold text-amber-400 font-iansui flex items-center gap-2">
                    <i class="fas fa-list"></i> 10 款台灣小吃清單
                </h3>
                <button class="modal-close text-slate-400 hover:text-white p-1 text-lg">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="foodListContent" class="p-3 overflow-y-auto space-y-2 font-iansui divide-y divide-slate-800/60">
                <!-- Food list items generated by JS -->
            </div>
        </div>
    </div>

    <!-- Modal 2: Spin History Modal -->
    <div id="historyModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" onclick="event.stopPropagation()">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h3 class="text-base font-bold text-cyan-400 font-iansui flex items-center gap-2">
                    <i class="fas fa-history"></i> 拉霸紀錄 (<span id="historyCount">0</span>)
                </h3>
                <div class="flex items-center gap-2">
                    <button id="clearHistoryBtn" class="text-xs text-rose-400 hover:text-rose-300 bg-rose-950/50 hover:bg-rose-900/50 px-2 py-0.5 rounded border border-rose-800/50 font-iansui transition">
                        清除紀錄
                    </button>
                    <button class="modal-close text-slate-400 hover:text-white p-1 text-lg">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="historyListContent" class="p-3 overflow-y-auto space-y-2 font-iansui">
                <!-- History items generated by JS -->
            </div>
        </div>
    </div>

    <script>
        // The exact 10 Taiwanese Food items requested
        const FOOD_ITEMS = [
            "Gû-bah-mī",
            "Pau-á-kiáⁿ",
            "Chin-chu-leng-tê",
            "Bah-sò-pn̄g",
            "Kiâm-so͘-ke",
            "Koah-pau",
            "Chhang-á-piáⁿ",
            "Ô-á-chian",
            "Chhàu-tāu-hū",
            "Soāiⁿ-á-peng"
        ];

        class BgmEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.enabled = true;
                this.timer = null;
                this.step = 0;

                this.notes = {
                    'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'G4': 392.00, 'A4': 440.00,
                    'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'G5': 783.99, 'A5': 880.00,
                    'OFF': 0
                };

                this.melody = [
                    'E5', 'G5', 'A5', 'G5', 'E5', 'D5', 'C5', 'D5',
                    'E5', 'E5', 'G5', 'A5', 'G5', 'E5', 'D5', 'C5'
                ];

                this.bass = [
                    'C4', 'C4', 'A4', 'A4', 'F4', 'F4', 'G4', 'G4',
                    'C4', 'C4', 'A4', 'A4', 'F4', 'F4', 'G4', 'G4'
                ];
            }

            init(audioCtx) {
                if (audioCtx) {
                    this.ctx = audioCtx;
                }
            }

            start() {
                if (this.isPlaying || !this.enabled || !this.ctx) return;
                
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                this.isPlaying = true;
                this.step = 0;
                
                const stepTime = 160;
                this.timer = setInterval(() => {
                    if (!this.isPlaying || !this.enabled) return;
                    this.playStep();
                    this.step = (this.step + 1) % 16;
                }, stepTime);
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            toggle() {
                this.enabled = !this.enabled;
                if (this.enabled) {
                    if (this.ctx) this.start();
                } else {
                    this.stop();
                }
                return this.enabled;
            }

            playStep() {
                if (!this.ctx || this.ctx.state !== 'running') return;
                const now = this.ctx.currentTime;

                const noteName = this.melody[this.step];
                if (noteName !== 'OFF' && this.notes[noteName]) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(this.notes[noteName], now);

                    gain.gain.setValueAtTime(0.035, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);
                }

                if (this.step % 2 === 0) {
                    const bassNote = this.bass[this.step];
                    if (this.notes[bassNote]) {
                        const oscB = this.ctx.createOscillator();
                        const gainB = this.ctx.createGain();

                        oscB.type = 'sine';
                        oscB.frequency.setValueAtTime(this.notes[bassNote] / 2, now);

                        gainB.gain.setValueAtTime(0.04, now);
                        gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                        oscB.connect(gainB);
                        gainB.connect(this.ctx.destination);

                        oscB.start(now);
                        oscB.stop(now + 0.26);
                    }
                }
            }
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgm = new BgmEngine();
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.bgm.init(this.ctx);
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (this.bgm.enabled && !this.bgm.isPlaying) {
                    this.bgm.start();
                }
            }

            playLeverSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playTickSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playWinSound() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + idx * 0.08);
                    osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
                });
            }
        }

        const sounds = new SoundEngine();

        // Global App State
        let isSpinning = false;
        let spinHistory = [];
        let bulbPhase = 0;
        let bulbInterval = null;
        let currentItemIndex = 0;

        // DOM Element references
        const reelContainer = document.getElementById('reelContainer');
        const reelWindow = document.getElementById('reelWindow');
        const leverArm = document.getElementById('leverArm');
        const leverBall = document.getElementById('leverBall');
        const leverAssembly = document.getElementById('leverAssembly');
        const menuModal = document.getElementById('menuModal');
        const historyModal = document.getElementById('historyModal');

        function getItemHeight() {
            return reelWindow ? reelWindow.clientHeight : 120;
        }

        function buildReelDOM() {
            reelContainer.innerHTML = '';
            const itemHeight = getItemHeight();
            
            const extendedList = [];
            for (let i = 0; i < 6; i++) {
                extendedList.push(...FOOD_ITEMS);
            }

            extendedList.forEach((item) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'w-full flex items-center justify-center px-3 text-center flex-shrink-0';
                itemEl.style.height = `${itemHeight}px`;
                itemEl.innerHTML = `
                    <div class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black text-amber-300 font-iansui leading-tight tracking-wide whitespace-nowrap overflow-hidden text-ellipsis max-w-full">${item}</div>
                `;
                reelContainer.appendChild(itemEl);
            });
            
            setReelPosition(10, false);
        }

        function setReelPosition(index, animate = false) {
            const itemHeight = getItemHeight();
            const targetY = -(index * itemHeight);
            
            if (!animate) {
                reelContainer.style.transition = 'none';
            }
            reelContainer.style.transform = `translateY(${targetY}px)`;
        }

        function initBulbs() {
            const topBulbs = document.querySelectorAll('#topBulbs .bulb');
            const bottomBulbs = document.querySelectorAll('#bottomBulbs .bulb');
            const allBulbs = [...topBulbs, ...bottomBulbs];

            bulbInterval = setInterval(() => {
                bulbPhase = (bulbPhase + 1) % 3;
                allBulbs.forEach((bulb, idx) => {
                    bulb.classList.remove('active-1', 'active-2', 'active-3');
                    if ((idx + bulbPhase) % 3 === 0) {
                        bulb.classList.add('active-1');
                    } else if ((idx + bulbPhase) % 3 === 1) {
                        bulb.classList.add('active-2');
                    } else {
                        bulb.classList.add('active-3');
                    }
                });
            }, 300);
        }

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;

            sounds.init();
            sounds.playLeverSound();

            triggerLeverAnimation();

            const targetFoodIndex = Math.floor(Math.random() * FOOD_ITEMS.length);
            const targetFood = FOOD_ITEMS[targetFoodIndex];
            currentItemIndex = targetFoodIndex;

            const targetDOMIndex = (3 * FOOD_ITEMS.length) + targetFoodIndex;

            reelContainer.classList.add('blur-motion');

            let tickCount = 0;
            const tickInterval = setInterval(() => {
                sounds.playTickSound();
                tickCount++;
                if (tickCount > 20) clearInterval(tickInterval);
            }, 100);

            setTimeout(() => {
                reelContainer.style.transition = 'transform 2.8s cubic-bezier(0.15, 0.85, 0.35, 1)';
                setReelPosition(targetDOMIndex, true);
            }, 50);

            setTimeout(() => {
                reelContainer.classList.remove('blur-motion');
                sounds.playWinSound();
                triggerConfetti();

                addToHistory(targetFood);

                setTimeout(() => {
                    setReelPosition(10 + targetFoodIndex, false);
                }, 100);

                isSpinning = false;
            }, 2900);
        }

        function triggerLeverAnimation() {
            leverAssembly.classList.add('lever-pulled');
            setTimeout(() => {
                leverAssembly.classList.remove('lever-pulled');
            }, 300);
        }

        function addToHistory(food) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            spinHistory.unshift({
                name: food,
                time: timeStr
            });
            updateHistoryModal();
        }

        function updateHistoryModal() {
            const countEl = document.getElementById('historyCount');
            const listEl = document.getElementById('historyListContent');
            
            countEl.textContent = spinHistory.length;

            if (spinHistory.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-6 text-slate-500 font-iansui text-sm">
                        <i class="fas fa-dice text-2xl mb-1 block"></i>
                        尚無拉霸紀錄
                    </div>
                `;
                return;
            }

            listEl.innerHTML = spinHistory.map((item) => `
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div>
                        <div class="text-amber-300 font-bold text-base leading-tight font-iansui">${item.name}</div>
                        <div class="text-[10px] text-slate-500">${item.time}</div>
                    </div>
                    <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">抽中</span>
                </div>
            `).join('');
        }

        function renderFoodListModal() {
            const listEl = document.getElementById('foodListContent');
            listEl.innerHTML = FOOD_ITEMS.map((food, idx) => `
                <div class="pt-2 first:pt-0 flex items-center gap-2.5">
                    <div class="w-6 h-6 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-400 font-bold text-xs flex items-center justify-center flex-shrink-0">
                        ${idx + 1}
                    </div>
                    <div class="flex-1">
                        <span class="text-xl font-extrabold text-amber-300 font-iansui">${food}</span>
                    </div>
                </div>
            `).join('');
        }

        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            particles = [];
            const colors = ['#ffb703', '#fb8500', '#ff2a6d', '#05d9e8', '#e0aaff'];
            
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 - 30,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 7 + 3,
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }
            requestAnimationFrame(updateConfetti);
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.rotation += p.rotSpeed;
                p.opacity -= 0.018;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();

                if (p.opacity <= 0) {
                    particles.splice(idx, 1);
                }
            });

            if (particles.length > 0) {
                requestAnimationFrame(updateConfetti);
            }
        }

        window.onload = function() {
            buildReelDOM();
            initBulbs();
            renderFoodListModal();
            updateHistoryModal();

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    buildReelDOM();
                });
            }

            document.addEventListener('click', (e) => {
                sounds.init();

                if (!menuModal.classList.contains('hidden') || !historyModal.classList.contains('hidden')) {
                    return;
                }
                startSpin();
            });

            leverAssembly.addEventListener('click', (e) => {
                e.stopPropagation();
                sounds.init();
                startSpin();
            });

            const bgmToggleBtn = document.getElementById('bgmToggleBtn');
            const bgmIcon = document.getElementById('bgmIcon');
            bgmToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sounds.init();
                const isEnabled = sounds.bgm.toggle();
                if (isEnabled) {
                    bgmIcon.className = "fas fa-music text-base md:text-lg text-amber-400";
                } else {
                    bgmIcon.className = "fas fa-music text-base md:text-lg text-slate-500 line-through";
                }
            });

            const soundToggleBtn = document.getElementById('soundToggleBtn');
            soundToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sounds.enabled = !sounds.enabled;
                soundToggleBtn.innerHTML = sounds.enabled 
                    ? '<i class="fas fa-volume-up text-base md:text-lg"></i>' 
                    : '<i class="fas fa-volume-mute text-base md:text-lg text-slate-500"></i>';
            });

            const menuBtn = document.getElementById('menuBtn');
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuModal.classList.remove('hidden');
            });

            const historyBtn = document.getElementById('historyBtn');
            historyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                historyModal.classList.remove('hidden');
            });

            document.querySelectorAll('.modal-close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    menuModal.classList.add('hidden');
                    historyModal.classList.add('hidden');
                });
            });

            document.getElementById('clearHistoryBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                spinHistory = [];
                updateHistoryModal();
            });

            window.addEventListener('resize', () => {
                buildReelDOM();
                setReelPosition(10 + currentItemIndex, false);
            });
        };
    </script>
</body>
</html>
